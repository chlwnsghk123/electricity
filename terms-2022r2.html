<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>전기기사 용어 모험 — 2022년 2회</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e7ebf2;
  --text:#1b232c; --dim:#5d6b7a; --line:#dfe4ec;
  --primary:#3b6cf0; --primary-soft:#e2e9ff; --on-primary:#fff;
  --accent:#f0a020; --good:#15a86b; --bad:#e2483c;
  --d1:#15a86b; --d2:#f0a020; --d3:#e2483c;
  --shadow:0 2px 10px rgba(20,30,50,.08); --shadow-lg:0 8px 28px rgba(20,30,50,.16);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#0f141a; --surface:#19212b; --surface-2:#212b37; --surface-3:#2b3744;
  --text:#e8edf3; --dim:#9aa7b5; --line:#2c3744;
  --primary:#5e8bff; --primary-soft:#1f2e4d; --on-primary:#fff;
  --accent:#ffbe4d; --good:#3ad696; --bad:#ff6f64;
  --d1:#3ad696; --d2:#ffbe4d; --d3:#ff6f64;
  --shadow:0 2px 10px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable',Pretendard,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1.6;font-size:15px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px;margin:0 auto;padding:16px 14px 60px;min-height:100%}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
h1,h2,h3{line-height:1.35}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:12px;color:var(--dim);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.back-btn{display:flex;align-items:center;gap:5px;background:var(--surface);box-shadow:var(--shadow);
  padding:8px 13px;border-radius:12px;font-weight:700;font-size:14px}

/* hero */
.hero{background:linear-gradient(135deg,var(--primary),#6d4bf0);color:#fff;border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-lg);margin-bottom:14px}
.hero .rank{font-size:13px;opacity:.9;font-weight:600}
.hero .rank b{font-size:20px;font-weight:800;display:block;margin-top:1px;letter-spacing:-.02em}
.hero .pwrap{margin-top:12px}
.pbar{height:9px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.pbar>span{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.hero .pstat{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.95;font-weight:600}
.intro-note{font-size:13px;color:var(--dim);background:var(--surface);border-radius:12px;
  padding:11px 13px;margin-bottom:14px;box-shadow:var(--shadow);border-left:3px solid var(--accent)}

/* stages */
.stage{display:flex;gap:13px;align-items:center;background:var(--surface);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);margin-bottom:11px;border:1.5px solid transparent;transition:transform .12s}
.stage:not(.locked):active{transform:scale(.985)}
.stage.locked{opacity:.55}
.stage.cleared{border-color:var(--good)}
.stage-ic{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;
  align-items:center;justify-content:center;font-size:27px;flex:none}
.stage.cleared .stage-ic{background:color-mix(in srgb,var(--good) 18%,transparent)}
.stage-body{flex:1;min-width:0}
.stage-no{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.04em}
.stage-name{font-size:16px;font-weight:800;letter-spacing:-.02em}
.stage-sub{font-size:12px;color:var(--dim);font-weight:600}
.stage-prog{display:flex;align-items:center;gap:7px;margin-top:6px}
.stage-prog .mini{flex:1;height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.stage-prog .mini>span{display:block;height:100%;background:var(--primary);border-radius:99px}
.stage-prog .lab{font-size:11px;color:var(--dim);font-weight:700;flex:none}
.stage-status{font-size:21px;flex:none}

/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 16px;
  border-radius:13px;font-weight:800;font-size:15px;background:var(--surface-2);color:var(--text);
  box-shadow:var(--shadow)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-accent{background:var(--accent);color:#3a2600}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:9px;margin-top:14px}
.btn-row .btn{flex:1}

/* tabs */
.tabs{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.tab{flex:1;padding:9px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--dim);text-align:center}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}

/* story */
.story-box{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.story-stage{font-size:13px;color:var(--primary);font-weight:800}
.story-title{font-size:22px;font-weight:800;margin:3px 0 12px;letter-spacing:-.02em}
.mentor{display:flex;gap:10px;background:var(--surface-2);border-radius:13px;padding:13px;margin-bottom:12px}
.mentor .face{font-size:30px;flex:none}
.mentor .who{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:2px}
.mentor .line{font-size:14px}
.story-text{font-size:14.5px;color:var(--text)}

/* term cards */
.grid-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;
  color:var(--dim);font-weight:700}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
.tcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  border:1.5px solid var(--line);transition:transform .12s}
.tcard:active{transform:scale(.99)}
.tcard.learned{border-color:var(--good)}
.tcard-head{padding:13px 14px;display:flex;align-items:flex-start;gap:8px}
.tcard-term{font-size:15.5px;font-weight:800;flex:1;letter-spacing:-.01em}
.tcard-stars{font-size:11px;letter-spacing:1px;flex:none;margin-top:2px}
.d1{color:var(--d1)}.d2{color:var(--d2)}.d3{color:var(--d3)}
.tcard-tip{font-size:11px;color:var(--dim);padding:0 14px 11px;font-weight:600;margin-top:-4px}
.tcard-learn-dot{font-size:14px;flex:none}
.tcard-def{max-height:0;overflow:hidden;transition:max-height .3s ease}
.tcard.open .tcard-def{max-height:760px}
.tcard-def-in{padding:2px 14px 14px;border-top:1px solid var(--line)}
.tcard-def-in p{font-size:14px;margin:10px 0}
.tcard-src{font-size:11px;color:var(--dim);font-weight:700}
.tcard-acts{display:flex;gap:8px;margin-top:11px}
.tcard-acts .btn{flex:1;padding:10px;font-size:13.5px}

/* quiz */
.quiz-intro{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center}
.quiz-intro h3{font-size:18px;margin-bottom:7px}
.quiz-intro p{font-size:13.5px;color:var(--dim);margin-bottom:4px}
.qbest{display:inline-block;margin-top:10px;background:var(--surface-2);padding:6px 13px;border-radius:99px;
  font-size:13px;font-weight:800}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;
  color:var(--dim);margin-bottom:8px}
.qbar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qbar>span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.q-prompt{background:var(--surface);border-radius:14px;padding:17px;box-shadow:var(--shadow);
  font-size:15px;margin-bottom:7px}
.q-prompt .q-ask{font-size:12px;color:var(--primary);font-weight:800;display:block;margin-bottom:7px}
.q-choices{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.choice{text-align:left;padding:13px 15px;border-radius:12px;background:var(--surface);
  box-shadow:var(--shadow);font-weight:700;font-size:14.5px;border:1.5px solid var(--line);
  display:flex;gap:9px;align-items:center}
.choice .mk{flex:none;font-size:16px}
.choice.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.choice.disabled{opacity:.6}
.q-explain{margin-top:13px;background:var(--surface-2);border-radius:12px;padding:13px;font-size:13.5px}
.q-explain b{color:var(--primary)}

/* result */
.result{background:var(--surface);border-radius:var(--radius);padding:24px 18px;box-shadow:var(--shadow);text-align:center}
.result .big{font-size:46px;margin-bottom:4px}
.result .verdict{font-size:21px;font-weight:800;margin-bottom:3px}
.result .score{font-size:14px;color:var(--dim);font-weight:700}
.result .rankup{margin-top:14px;background:linear-gradient(135deg,var(--accent),#ff8a3d);color:#3a2600;
  border-radius:12px;padding:12px;font-weight:800;font-size:14px}

/* qnote */
.search{width:100%;padding:11px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  border:1.5px solid var(--line);font-size:14px;color:var(--text);margin-bottom:13px}
.search::placeholder{color:var(--dim)}
.qn-group-title{font-size:13px;font-weight:800;color:var(--primary);margin:16px 0 8px}
.qn-item{background:var(--surface);border-radius:13px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
.qn-top{padding:12px 13px;display:flex;gap:9px;align-items:flex-start}
.qn-main{flex:1;min-width:0}
.qn-term{font-size:12px;font-weight:800;color:var(--accent)}
.qn-q{font-size:14px;font-weight:700;margin-top:2px}
.qn-meta{font-size:11px;color:var(--dim);margin-top:3px;font-weight:600}
.qn-del{flex:none;font-size:16px;opacity:.6;padding:2px 4px}
.qn-a{max-height:0;overflow:hidden;transition:max-height .3s}
.qn-item.open .qn-a{max-height:1200px}
.qn-a-in{padding:0 13px 13px;font-size:13.5px;border-top:1px solid var(--line);padding-top:11px}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:8px}

/* review */
.rv-count{text-align:center;font-size:13px;color:var(--dim);font-weight:800;margin-bottom:10px}
.rv-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:24px 20px;min-height:280px;display:flex;flex-direction:column;justify-content:center}
.rv-tag{font-size:12px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:10px}
.rv-q{font-size:17px;font-weight:800;text-align:center;letter-spacing:-.01em}
.rv-hint{text-align:center;color:var(--dim);font-size:12.5px;margin-top:16px;font-weight:600}
.rv-ans{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:14px}
.rv-nav{display:flex;gap:9px;margin-top:13px}
.rv-nav .btn{flex:1}

/* ai modal */
.ai-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ai-ov{position:absolute;inset:0;background:rgba(10,15,25,.55)}
.ai-sheet{position:relative;width:100%;max-width:660px;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  animation:slideup .26s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ai-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.ai-head .t{flex:1;min-width:0}
.ai-head .t b{font-size:15px;font-weight:800;display:block;letter-spacing:-.01em}
.ai-head .t span{font-size:11.5px;color:var(--dim);font-weight:600}
.ai-body{flex:1;overflow-y:auto;padding:14px 16px}
.ai-def{background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--dim);margin-bottom:12px}
.msg{margin-bottom:11px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:84%;padding:10px 13px;border-radius:14px;font-size:14px}
.msg.user .bubble{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:5px}
.msg.model .bubble{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.ai-suggests{display:flex;flex-direction:column;gap:8px}
.suggest{text-align:left;padding:11px 13px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:11px;font-size:13.5px;font-weight:700}
.suggest:before{content:"💬 ";opacity:.7}
.ai-loading{font-size:13px;color:var(--dim);font-weight:700;padding:4px}
.ai-err{font-size:13px;color:var(--bad);font-weight:700;background:color-mix(in srgb,var(--bad) 12%,transparent);
  padding:9px 12px;border-radius:10px}
.ai-foot{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;
  padding-bottom:max(11px,env(safe-area-inset-bottom))}
.ai-input{flex:1;resize:none;border:1.5px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:13px;padding:10px 13px;font-size:14px;font-family:inherit;max-height:110px;line-height:1.5}
.ai-send{width:44px;height:44px;border-radius:13px;background:var(--primary);color:#fff;font-size:18px;flex:none}
.ai-send:disabled{opacity:.45}

/* misc */
.foot{text-align:center;margin-top:22px}
.foot button{font-size:12px;color:var(--dim);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.foot .v{font-size:11px;color:var(--dim);margin-top:6px}
.section-gap{margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ai" class="ai-modal hidden" aria-hidden="true"></div>
<script>
"use strict";

/* ============ DATA: STORY ============ */
const STORY = {
  title: "전기기사 용어 모험",
  round: "2022년 2회",
  intro: "이제 막 공부를 시작한 당신은 견습 전기기사입니다. ‘전기 명장’이 되려면 다섯 관문을 넘어 그곳의 용어를 모두 익혀야 합니다. 첫 관문, 전자기의 숲으로 떠나볼까요?",
  grades: ["견습 전기기사","기사보","3급 전기기사","2급 전기기사","1급 전기기사","전기 명장"],
  stages: [
    { subject:1, name:"전자기의 숲", subjectName:"전기자기학", icon:"🌲", mentor:"숲의 안내자", face:"🧙",
      intro:"눈에 보이지 않는 전기장과 자기장이 안개처럼 깔린 숲입니다.",
      line:"이곳의 힘은 보이지 않지만 분명히 존재한다네. 용어를 알면 그 힘이 비로소 눈에 보이지.",
      clear:"안개가 걷히고 숲길이 환하게 드러납니다. 보이지 않던 장(場)의 세계가 이제 당신의 눈에 보입니다." },
    { subject:2, name:"송전의 대협곡", subjectName:"전력공학", icon:"🗼", mentor:"송전탑 감시인", face:"👷",
      intro:"거대한 송전탑들이 협곡을 가로지르며 전기를 실어 나릅니다.",
      line:"발전소에서 너의 집까지 — 그 먼 길을 전기가 안전하게 건너오게 하는 용어들을 익혀라.",
      clear:"협곡의 송전선이 안정적으로 빛납니다. 전기가 어떻게 도시까지 오는지 이제 이해했습니다." },
    { subject:3, name:"회전기 대장간", subjectName:"전기기기", icon:"⚙️", mentor:"대장간의 노장", face:"🧔",
      intro:"쇠 두드리는 소리가 울리는 대장간입니다. 노장이 변압기와 전동기를 가리킵니다.",
      line:"전기를 힘으로, 힘을 전기로 — 돌고 도는 기계들의 언어를 배워라.",
      clear:"대장간의 기계들이 매끄럽게 돌아갑니다. 발전기와 전동기, 변압기가 더는 낯설지 않습니다." },
    { subject:4, name:"회로 미궁", subjectName:"회로이론 및 제어공학", icon:"🧩", mentor:"미궁의 설계자", face:"🦉",
      intro:"복잡하게 얽힌 회로의 미궁입니다. 설계자가 미소 짓습니다.",
      line:"길은 수식으로 적혀 있다. 전달함수와 제어의 언어를 알면 어떤 미궁도 풀 수 있지.",
      clear:"미궁의 회로가 하나의 명확한 길로 정리됩니다. 입력과 출력, 그 사이 모든 흐름이 보입니다." },
    { subject:5, name:"규정의 탑", subjectName:"전기설비기술기준 및 판단기준", icon:"🏛️", mentor:"탑의 시험관", face:"⚖️",
      intro:"마지막 관문, 규정의 탑입니다. 시험관이 두꺼운 규정집을 펼칩니다.",
      line:"기술은 안전 위에 선다. 사람을 지키는 규정의 용어들을 익혀라.",
      clear:"탑 꼭대기에 오른 당신에게 시험관이 명장의 증표를 건넵니다. ‘이제 자네는 전기 명장이다.’" }
  ]
};

/* ============ DATA: TERMS ============ */
const TERMS = [
  { id:"s1-01", subject:1, term:"고유 임피던스 (특성 임피던스)", difficulty:3, def:"어떤 매질 속을 전자기파가 지나갈 때, 그 매질이 전기장과 자기장의 크기 비율을 얼마로 정해 주는지를 나타내는 값입니다. 마치 물질마다 빛이 휘는 정도가 다르듯, 매질마다 전자기파를 받아들이는 고유한 성질이 있어요. 진공에서는 약 377옴이고, 단위는 옴(Ω)입니다.", source:[1] },
  { id:"s1-02", subject:1, term:"비유전율 εᵣ", difficulty:1, def:"어떤 물질이 진공보다 전기를 얼마나 더 잘 머금는지 나타내는 배수입니다. 스펀지가 물을 빨아들이듯, 비유전율이 큰 물질은 같은 전압에서도 전하를 훨씬 많이 저장해요. 진공과 공기는 1, 물은 약 80이라 물속에서는 두 전하 사이 전기력이 80배 약해집니다.", source:[1,5,12] },
  { id:"s1-03", subject:1, term:"비투자율 μᵣ", difficulty:1, def:"어떤 물질이 진공보다 자기력선(자속)을 얼마나 더 잘 통과시키는지 나타내는 배수입니다. 좁은 길보다 넓은 고속도로로 차가 잘 다니듯, 비투자율이 큰 철 같은 물질은 자속이 훨씬 잘 지나가요. 진공과 공기는 1, 철심은 수천에서 수만에 이릅니다.", source:[1,8] },
  { id:"s1-04", subject:1, term:"매질", difficulty:1, def:"전기장이나 자기장, 전자기파가 퍼져 나가는 무대가 되는 물질이나 공간을 말합니다. 소리가 공기를 타고 퍼지듯, 전자기 현상도 진공이든 물이든 어떤 매질 위에서 일어나요. 매질의 종류에 따라 전기력의 세기나 파동이 지나가는 성질이 달라집니다.", source:[1] },
  { id:"s1-05", subject:1, term:"강자성체", difficulty:2, def:"철, 니켈, 코발트처럼 외부 자기장에 매우 강하게 끌리고, 자기장을 없애도 자석 성질이 남는 물질입니다. 한번 줄을 세우면 잘 흐트러지지 않는 단체 사진처럼, 내부의 작은 자석들이 한 방향으로 잘 정렬돼요. 영구자석이나 변압기 철심의 재료로 쓰입니다.", source:[2] },
  { id:"s1-06", subject:1, term:"B-H 곡선 (자화곡선)", difficulty:2, def:"자성체에 가하는 자기장의 세기(H)를 키울 때 그 안의 자속밀도(B)가 어떻게 변하는지 그린 그래프입니다. 풍선에 바람을 점점 넣을 때 처음엔 잘 부풀다 나중엔 한계에 다다르듯, 자속밀도도 어느 순간 더 이상 늘지 않고 포화돼요. 자성체의 성질을 한눈에 보여주는 핵심 그래프입니다.", source:[2] },
  { id:"s1-07", subject:1, term:"자속밀도 B", difficulty:2, def:"자기장이 단위 면적을 얼마나 빽빽하게 통과하는지를 나타내는 값으로, 자기장의 진짜 세기를 보여줍니다. 같은 비가 와도 좁은 깔때기에 모이면 더 세찬 물줄기가 되듯, 자속이 좁은 면적에 모일수록 자속밀도가 큽니다. 단위는 테슬라(T) 또는 Wb/m²입니다.", source:[2] },
  { id:"s1-08", subject:1, term:"퀴리점 (퀴리 온도)", difficulty:2, def:"강자성체를 가열하다가 이 온도를 넘으면 자석 성질을 잃고 평범한 물질이 되는 경계 온도입니다. 차분히 줄 맞춰 선 사람들이 갑자기 더위에 흩어지듯, 열에너지가 너무 커지면 내부 자석들의 정렬이 무너져요. 철의 퀴리점은 약 770도씨입니다.", source:[2] },
  { id:"s1-09", subject:1, term:"자왜현상 (자기변형)", difficulty:3, def:"자성체에 자기장을 걸면 그 모양이나 길이가 아주 미세하게 늘어나거나 줄어드는 현상입니다. 근육이 신호를 받으면 수축하듯, 쇳덩이도 자기장에 반응해 살짝 몸을 떨어요. 변압기에서 윙 하는 소리가 나는 이유가 바로 이 현상 때문입니다.", source:[2] },
  { id:"s1-10", subject:1, term:"바크하우젠 효과", difficulty:3, def:"강자성체를 서서히 자화시킬 때 자속밀도가 매끄럽게 늘지 않고 아주 작은 계단처럼 뚝뚝 끊겨 증가하는 현상입니다. 미끄럼틀이 아니라 계단을 내려가듯, 내부의 자기 구역들이 한꺼번에 휙휙 방향을 바꾸기 때문이에요. 이 미세한 점프가 모여 B-H 곡선을 확대하면 톱니처럼 보입니다.", source:[2] },
  { id:"s1-11", subject:1, term:"자기여자 효과 (자기 여효)", difficulty:3, def:"자성체에 자기장을 걸거나 없앤 뒤, 자화 상태가 곧바로 따라오지 않고 시간이 조금 지나서야 천천히 바뀌는 현상입니다. 스위치를 눌러도 한 박자 늦게 켜지는 낡은 전구처럼, 자성체의 반응에 약간의 시간 지연이 생겨요. 자기적인 일종의 뒷북 반응입니다.", source:[2] },
  { id:"s1-12", subject:1, term:"무한 평면도체", difficulty:2, def:"이론 계산을 쉽게 하려고 끝없이 넓게 펼쳐졌다고 가정한 평평한 도체 판입니다. 실제로는 불가능하지만, 아주 큰 금속판 가까이에서는 가장자리 영향을 무시할 수 있어 이렇게 단순화해요. 마치 거대한 운동장 한가운데 서면 끝이 안 보여 평면처럼 느껴지는 것과 같습니다.", source:[3] },
  { id:"s1-13", subject:1, term:"선전하밀도 λ", difficulty:2, def:"가느다란 선이나 도선을 따라 전하가 단위 길이마다 얼마나 모여 있는지를 나타내는 값입니다. 긴 빨랫줄에 빨래집게가 1미터마다 몇 개씩 걸려 있는지 세는 것과 같아요. 단위는 C/m(쿨롬 퍼 미터)입니다.", source:[3] },
  { id:"s1-14", subject:1, term:"영상전하법 (전기영상법)", difficulty:3, def:"도체 판 근처의 전하 문제를 풀 때, 도체를 치우고 그 너머에 거울에 비친 듯한 가상의 반대 전하를 놓아 계산하는 방법입니다. 거울 속 내 모습이 실제처럼 보이듯, 이 가상 전하가 도체가 만드는 효과를 똑같이 흉내 내요. 무한 평면도체와 전하 사이 힘을 구할 때 핵심 도구입니다.", source:[3] },
  { id:"s1-15", subject:1, term:"유전율 ε", difficulty:2, def:"어떤 물질이 전기장 속에서 전하를 얼마나 잘 저장하고 전기력을 얼마나 약하게 만드는지를 나타내는 고유한 성질입니다. 푹신한 방석이 충격을 흡수하듯, 유전율이 큰 물질은 전기장의 힘을 더 많이 누그러뜨려요. 단위는 F/m(패럿 퍼 미터)입니다.", source:[3,4,6,13] },
  { id:"s1-16", subject:1, term:"유전체", difficulty:2, def:"전류는 거의 흐르지 않지만 전기장 속에서 내부 전하가 살짝 쏠리며 전기를 저장하는 절연 물질입니다. 유리, 고무, 기름 등이 해당돼요. 물길을 막되 물의 압력은 고스란히 전달하는 댐처럼, 전류는 막으면서 전기적 영향은 통과시킵니다. 커패시터 안을 채우는 핵심 재료입니다.", source:[4,5,6,12] },
  { id:"s1-17", subject:1, term:"유전체 경계면", difficulty:3, def:"유전율이 서로 다른 두 유전체가 맞닿아 있는 경계 면을 말합니다. 물과 기름이 만나는 면처럼, 이 경계를 지날 때 전기장과 전속밀도의 성질이 달라지며 꺾여요. 이 경계면에는 두 유전체를 서로 밀거나 당기는 힘이 작용합니다.", source:[4,6] },
  { id:"s1-18", subject:1, term:"평행 극판 (평행판)", difficulty:1, def:"두 장의 넓은 금속판을 나란히 마주 보게 배치한 구조로, 커패시터의 가장 기본적인 형태입니다. 두 판 사이에는 거의 균일한 전기장이 생겨요. 마치 두 손바닥을 가까이 마주 댄 사이의 공간처럼, 그 안에서 전하와 에너지가 저장됩니다.", source:[4,5,12] },
  { id:"s1-19", subject:1, term:"정전용량 C", difficulty:1, def:"어떤 도체나 커패시터가 같은 전압에서 전하를 얼마나 많이 담을 수 있는지를 나타내는 그릇의 크기 같은 값입니다. 큰 양동이가 물을 많이 담듯, 정전용량이 크면 같은 전압에서도 전하를 더 많이 저장해요. 단위는 패럿(F)입니다.", source:[5,12,13,16,18] },
  { id:"s1-20", subject:1, term:"커패시터 (콘덴서)", difficulty:1, def:"전하를 모아 두었다가 필요할 때 내보내는, 전기를 저장하는 부품입니다. 물을 받아 두는 물탱크처럼, 전압을 걸면 전하가 채워지고 회로가 필요로 하면 다시 흘려보내요. 두 도체판 사이에 유전체를 끼운 구조가 기본입니다.", source:[5,10,12,16,18] },
  { id:"s1-21", subject:1, term:"전하량 Q", difficulty:1, def:"어떤 물체가 띠고 있는 전기의 양을 나타내는 값으로, 전기 현상의 근원이 되는 기본량입니다. 물탱크에 담긴 물의 총량을 세는 것처럼, 전하량은 모인 전기의 총량을 말해요. 단위는 쿨롬(C)입니다.", source:[5,6,11] },
  { id:"s1-22", subject:1, term:"분극 (유전분극)", difficulty:3, def:"유전체에 전기장을 걸면 내부의 양전하와 음전하가 서로 반대 방향으로 아주 살짝 쏠리며 줄지어 정렬되는 현상입니다. 자석을 대면 쇳가루가 한 방향으로 늘어서듯, 유전체 속 전하들도 전기장 방향에 맞춰 정돈돼요. 이 덕분에 유전체가 전기를 더 많이 저장합니다.", source:[5] },
  { id:"s1-23", subject:1, term:"분극 전하 (속박전하)", difficulty:3, def:"유전체가 분극될 때 그 표면에 새로 드러나는 전하로, 자유롭게 돌아다니지 못하고 제자리에 묶여 있는 전하입니다. 운동장에 줄 선 학생들의 맨 앞줄과 맨 뒷줄만 도드라져 보이는 것처럼, 유전체 양 끝 표면에만 나타나요. 외부 전기장을 약화시키는 역할을 하며 단위는 쿨롬(C)입니다.", source:[5] },
  { id:"s1-24", subject:1, term:"흡인력", difficulty:1, def:"두 물체가 서로 끌어당기는 힘을 말합니다. 전기에서는 양전하와 음전하 사이에, 자기에서는 N극과 S극 사이에 생겨요. 자석이 클립을 끌어당기듯, 서로 다른 성질끼리 가까워지려는 힘입니다.", source:[6] },
  { id:"s1-25", subject:1, term:"반발력", difficulty:1, def:"두 물체가 서로 밀어내는 힘을 말합니다. 같은 부호의 전하끼리, 또는 같은 극의 자석끼리 생겨요. 같은 극을 마주 댄 두 자석이 서로 튕겨 나가듯, 닮은 성질끼리 멀어지려는 힘입니다.", source:[6] },
  { id:"s1-26", subject:1, term:"환상철심 (환상 솔레노이드)", difficulty:2, def:"도넛처럼 둥근 고리 모양으로 만든 철심으로, 그 둘레에 코일을 감아 자기 회로를 만듭니다. 자속이 고리 안을 빙글빙글 돌며 거의 새지 않고 갇혀 있어요. 둥근 육상 트랙을 도는 선수처럼 자속이 닫힌 경로를 따라 흐르는 이상적인 구조입니다.", source:[7,8] },
  { id:"s1-27", subject:1, term:"권수 (권선수) N", difficulty:1, def:"코일을 몇 바퀴나 감았는지 그 횟수를 말합니다. 같은 전류라도 더 많이 감을수록 자기장이 강해져요. 실패에 실을 여러 겹 감을수록 두꺼워지듯, 권수가 많을수록 코일의 자기 효과가 커집니다.", source:[7,8,9,17] },
  { id:"s1-28", subject:1, term:"자기 인덕턴스 L", difficulty:2, def:"코일의 전류가 변하려 할 때, 코일이 그 변화에 스스로 버티는 정도입니다. 무거운 회전문은 밀기 시작할 때도 멈출 때도 힘이 들죠. 인덕턴스가 큰 코일도 전류를 갑자기 바꾸기 어렵습니다. 단위는 헨리(H)입니다.", source:[7,8] },
  { id:"s1-29", subject:1, term:"상호 인덕턴스 M", difficulty:2, def:"한 코일의 전류가 변할 때 옆에 있는 다른 코일에 전압을 만들어 내는 능력의 크기입니다. 한 그네를 밀면 줄로 이어진 옆 그네도 따라 흔들리듯, 두 코일이 자속으로 연결돼 영향을 주고받아요. 변압기 작동의 핵심 원리이며 단위는 헨리(H)입니다.", source:[7] },
  { id:"s1-30", subject:1, term:"누설자속", difficulty:2, def:"코일이나 철심으로 만든 자기 회로에서 정해진 경로를 벗어나 바깥으로 새어 나가는 자속입니다. 물 호스의 이음새에서 물이 조금씩 새는 것과 같아요. 누설자속이 적을수록 자기 회로의 효율이 좋고, 이론 문제에서는 흔히 0으로 가정합니다.", source:[7] },
  { id:"s1-31", subject:1, term:"자로 (자기 회로의 길이)", difficulty:2, def:"자속이 철심 같은 자성체 안을 한 바퀴 돌며 따라가는 닫힌 경로를 말합니다. 전류가 도선을 따라 흐르는 길이 있듯, 자속에게도 지나다니는 길이 있어요. 이 길의 길이가 길수록 같은 자속을 만들기가 더 어려워집니다.", source:[8] },
  { id:"s1-32", subject:1, term:"투자율 μ", difficulty:2, def:"어떤 물질이 자속을 얼마나 잘 통과시키는지를 나타내는 고유한 성질입니다. 물이 잘 스며드는 흙과 안 스며드는 점토가 다르듯, 투자율이 큰 물질일수록 자기장이 수월하게 지나가요. 단위는 H/m(헨리 퍼 미터)입니다.", source:[9] },
  { id:"s1-33", subject:1, term:"자속 Φ", difficulty:2, def:"어떤 면을 통과하는 자기력선의 총량을 말합니다. 창문을 통해 들어오는 햇빛의 총량을 세는 것처럼, 면을 뚫고 지나가는 자기장의 양 전체를 뜻해요. 자속이 변하면 전압이 유도되며, 단위는 웨버(Wb)입니다.", source:[9] },
  { id:"s1-34", subject:1, term:"변위전류", difficulty:3, def:"커패시터 극판 사이처럼 실제 전하는 못 흐르는 곳에서, 전기장이 빠르게 변하면 전류가 흐르는 것과 똑같은 효과가 생기는 것입니다. 강에 다리가 없어도 양쪽에서 깃발 신호를 빠르게 바꾸면 정보는 건너가듯이요. 이 개념 덕에 전자기파가 빈 공간을 건너갑니다.", source:[10] },
  { id:"s1-35", subject:1, term:"변위전류밀도 i_d", difficulty:3, def:"변위전류가 단위 면적을 얼마나 빽빽하게 흐르는지를 나타내는 값으로, 전속밀도가 시간에 따라 변하는 빠르기와 같습니다. 좁은 통로로 사람이 몰릴수록 흐름이 거세지듯, 면적당 변위전류가 클수록 밀도가 큽니다. 단위는 A/m²입니다.", source:[10] },
  { id:"s1-36", subject:1, term:"전속밀도 D", difficulty:3, def:"전기장이 단위 면적을 통과하는 정도를 나타내되, 유전체의 영향을 빼고 순수한 전하의 효과만 보여 주는 값입니다. 방 안에 사람이 몇 명 있는지를 가구 배치와 상관없이 세는 것과 같아요. 자유전하만으로 정해지며 단위는 C/m²입니다.", source:[10] },
  { id:"s1-37", subject:1, term:"표면전하밀도 σ", difficulty:2, def:"도체나 물체의 표면에 전하가 단위 면적마다 얼마나 모여 있는지를 나타내는 값입니다. 벽에 붙은 포스트잇이 1제곱미터마다 몇 장씩 있는지 세는 것과 같아요. 단위는 C/m²(쿨롬 퍼 제곱미터)입니다.", source:[10] },
  { id:"s1-38", subject:1, term:"점전하", difficulty:1, def:"크기를 무시할 만큼 아주 작은 한 점에 전하가 모여 있다고 보는 이상적인 모형입니다. 지구를 우주에서 보면 하나의 점처럼 보이듯, 멀리서 보는 전하를 단순하게 점으로 다뤄요. 전기력 계산을 쉽게 하기 위한 기본 개념입니다.", source:[11] },
  { id:"s1-39", subject:1, term:"단위벡터", difficulty:2, def:"크기가 정확히 1이면서 방향만을 알려 주는 벡터입니다. 길이는 중요하지 않고 오직 어느 쪽을 가리키는가만 나타내요. 나침반 바늘이 방향만 알려 주듯, 어떤 양이 향하는 방향을 깔끔하게 표시할 때 씁니다.", source:[11] },
  { id:"s1-40", subject:1, term:"전위계수 P", difficulty:3, def:"여러 도체가 모인 계에서, 어떤 도체에 놓인 전하가 자기 자신이나 다른 도체의 전위를 얼마나 끌어올리는지를 이어 주는 비례 상수입니다. 한 사람이 떠들면 자기 방과 옆방 소음이 각각 얼마나 커지는지 정해 주는 값과 같아요. 도체의 모양과 배치만으로 정해지며 단위는 1/F입니다.", source:[13] },
  { id:"s1-41", subject:1, term:"구도체", difficulty:1, def:"공처럼 둥근 모양의 도체를 말합니다. 모양이 완벽한 대칭이라 전하가 표면에 고르게 퍼지고 계산이 깔끔해서, 정전기 문제에 자주 등장해요. 잔잔한 호수에 던진 돌이 동그란 물결을 만들듯, 구도체 주위 전기장도 사방으로 대칭입니다.", source:[13,18] },
  { id:"s1-42", subject:1, term:"동심구 (동심 구도체)", difficulty:2, def:"중심이 같은 크고 작은 두 개의 구 껍질 도체를 겹쳐 놓은 구조입니다. 양파 껍질이나 러시아 인형처럼 안과 밖으로 둥글게 포개진 모양이에요. 두 구 사이 공간에 전기를 저장하는 동심구형 커패시터를 이룹니다.", source:[13,18] },
  { id:"s1-43", subject:1, term:"전위 V", difficulty:1, def:"전기장 속 어떤 위치가 단위 전하에 대해 갖는 전기적인 높이, 즉 위치 에너지의 정도입니다. 산의 높이가 높을수록 굴러떨어질 힘이 크듯, 전위가 높은 곳의 전하는 낮은 곳으로 이동하려 해요. 두 지점의 전위 차이가 바로 전압이며 단위는 볼트(V)입니다.", source:[13] },
  { id:"s1-44", subject:1, term:"자계의 세기 H", difficulty:2, def:"어떤 지점에서 자기장이 얼마나 센지를, 물질의 영향을 빼고 순수하게 나타내는 값입니다. 난로에서 떨어진 거리에 따라 느끼는 열기처럼, 전류나 자석에서 멀어질수록 약해져요. 단위는 A/m 또는 AT/m(암페어 턴 퍼 미터)입니다.", source:[14,15,17] },
  { id:"s1-45", subject:1, term:"무한장 직선 도선", difficulty:2, def:"이론 계산을 단순하게 하려고 양 끝이 끝없이 길다고 가정한 곧은 도선입니다. 실제로는 불가능하지만, 아주 긴 전선 가까이에서는 끝의 영향을 무시할 수 있어요. 끝이 안 보이는 일직선 기찻길을 떠올리면 됩니다. 이 도선에 전류가 흐르면 주위에 동심원 모양 자기장이 생깁니다.", source:[15] },
  { id:"s1-46", subject:1, term:"내압 (내전압)", difficulty:2, def:"커패시터 같은 부품이 절연이 깨지지 않고 견딜 수 있는 최대 전압입니다. 풍선이 터지기 전까지 견디는 공기압의 한계와 같아요. 이 값을 넘는 전압을 걸면 부품 안의 절연체가 파괴되어 못 쓰게 됩니다. 단위는 볼트(V)입니다.", source:[16] },
  { id:"s1-47", subject:1, term:"절연 파괴", difficulty:2, def:"절연체에 견딜 수 있는 한계를 넘는 전압이 걸려, 막혀 있던 곳으로 갑자기 전류가 뚫고 흐르는 현상입니다. 댐이 수압을 못 견디고 무너져 물이 쏟아지는 것과 같아요. 한번 파괴되면 절연 기능을 잃어 부품이나 기기가 손상됩니다.", source:[16] },
  { id:"s1-48", subject:1, term:"직렬 연결", difficulty:1, def:"여러 부품을 한 줄로 꼬리에 꼬리를 물듯 차례차례 이어 붙이는 연결 방식입니다. 좁은 외길에서는 모든 차가 같은 길을 지나가듯, 직렬 회로에서는 모든 부품에 같은 전류가 흘러요. 커패시터를 직렬로 이으면 전체 정전용량은 오히려 작아집니다.", source:[16] },
  { id:"s1-49", subject:1, term:"원형 코일", difficulty:2, def:"도선을 둥근 고리 모양으로 감아 만든 코일입니다. 전류를 흘리면 고리 한가운데에 고리면과 수직으로 자기장이 생겨요. 둥글게 모여 손뼉을 치면 가운데로 소리가 모이듯, 원형 코일도 중심에 자기장을 집중시킵니다.", source:[17] },
  { id:"s1-50", subject:1, term:"자성체", difficulty:2, def:"자기장 속에 놓였을 때 자기적인 반응을 보이는 물질을 통틀어 이르는 말입니다. 반응하는 방향과 세기에 따라 강자성체, 상자성체, 역자성체로 나뉘어요. 음악에 맞춰 크게 또는 작게, 혹은 반대로 움직이는 사람들처럼 물질마다 자기장에 반응하는 모습이 다릅니다.", source:[19] },
  { id:"s1-51", subject:1, term:"자화율 χ_m", difficulty:3, def:"어떤 물질이 외부 자기장에 놓였을 때 얼마나 잘, 그리고 어느 방향으로 자석처럼 변하는지를 나타내는 값입니다. 햇볕에 잘 타는 사람과 안 타는 사람이 있듯, 물질마다 자화되는 정도가 달라요. 값이 양수면 자기장 방향으로, 음수면 반대 방향으로 자화됩니다.", source:[19] },
  { id:"s1-52", subject:1, term:"역자성체", difficulty:3, def:"외부 자기장과 반대 방향으로 약하게 자화되어, 자석에 살짝 밀려나는 성질의 물질입니다. 구리, 은, 물 등이 해당돼요. 청개구리처럼 시키는 것과 반대로 행동하는 셈이라, 자화율이 음수이고 비투자율은 1보다 약간 작습니다.", source:[19] },
  { id:"s1-53", subject:1, term:"상자성체", difficulty:3, def:"외부 자기장과 같은 방향으로 약하게 자화되어, 자석에 살짝 끌리는 성질의 물질입니다. 알루미늄, 백금 등이 해당돼요. 강자성체만큼 강하진 않지만 순순히 자기장 방향을 따라가며, 자화율이 양수이고 비투자율은 1보다 약간 큽니다.", source:[19] },
  { id:"s1-54", subject:1, term:"비자성체", difficulty:2, def:"자기장에 거의 반응하지 않아 자석에 붙지 않는 물질을 말합니다. 비투자율이 1에 가까워 자속을 진공과 다름없이 통과시켜요. 자석을 대도 꿈쩍 않는 플라스틱이나 나무처럼, 자기적으로 무덤덤한 물질입니다.", source:[19] },
  { id:"s1-55", subject:1, term:"구좌표계", difficulty:3, def:"공간의 한 점을 가로세로높이 대신 중심에서의 거리와 두 개의 각도로 나타내는 좌표 방식입니다. 지구 위 위치를 위도와 경도, 고도로 말하는 것과 같아요. 구 모양이나 점전하처럼 중심 대칭인 문제를 풀 때 계산이 훨씬 간단해집니다.", source:[20] },
  { id:"s1-56", subject:1, term:"라플라시안 ∇²", difficulty:3, def:"어떤 양이 한 점 주위에서 평균보다 얼마나 볼록하거나 오목한지를 알려 주는 미분 연산자입니다. 어떤 자리가 주변보다 움푹 패였는지 솟았는지를 재는 도구와 같아요. 전위나 전기장이 공간에서 어떻게 분포하는지 푸는 전자기학의 핵심 수학 기호입니다.", source:[20] },
  { id:"s2-01", subject:2, term:"피뢰기", difficulty:2, def:"낙뢰나 개폐 충격으로 비정상적으로 높은 전압(이상전압)이 들어오면, 그 순간 통로를 열어 과잉 에너지를 땅으로 흘려보내고 전압이 정상으로 돌아오면 다시 닫는 보호 장치입니다. 마치 욕조 물이 넘치기 직전 자동으로 열리는 배수구처럼, 위험한 부분만 흘려보내고 변압기 같은 비싼 기기를 지켜줘요. 송배전 계통의 절연을 보호하는 핵심 장비입니다.", source:[21] },
  { id:"s2-02", subject:2, term:"충격방전 개시전압", difficulty:3, def:"피뢰기에 번개 같은 충격파 전압이 들어올 때, 피뢰기가 방전을 시작하는 그 순간의 전압 값입니다. 마치 풍선이 펑 하고 터지는 정확한 압력처럼, 이 값에 도달해야 피뢰기가 작동을 시작해요. 충격파는 순간적으로 솟구쳤다 사라지므로 평균치나 실효치가 아니라 가장 높이 솟은 값, 즉 최대치(파고치)로 표시합니다.", source:[21] },
  { id:"s2-03", subject:2, term:"충격파", difficulty:2, def:"번개나 회로 개폐 때 순간적으로 솟구쳤다가 금세 사라지는 짧고 뾰족한 전압·전류 파형입니다. 잔잔한 호수에 돌을 던졌을 때 한 번 크게 출렁이고 가라앉는 물결처럼, 한순간 치솟았다 빠르게 잦아드는 모양이에요. 주기적으로 반복되지 않기 때문에 그 크기는 보통 가장 높은 값인 최대치로 나타냅니다.", source:[21] },
  { id:"s2-04", subject:2, term:"실효치 (RMS)", difficulty:2, def:"끊임없이 변하는 교류의 크기를, 같은 일을 하는 직류로 환산해 나타낸 대표값입니다. 들쭉날쭉한 산길의 높낮이를 평균 경사 하나로 말하는 것처럼, 변하는 파형을 하나의 숫자로 요약해요. 우리가 흔히 말하는 220V도 실효치이며, 최대치를 √2로 나눈 값입니다.", source:[21] },
  { id:"s2-05", subject:2, term:"전력용 콘덴서", difficulty:2, def:"전선로에 진상(앞선) 무효전력을 공급해 역률을 끌어올리는 커패시터 설비입니다. 무거운 짐(유효전력)을 나르느라 비틀거리는 일꾼에게 균형추를 달아주는 것처럼, 계통의 무효전력 부담을 덜어줘요. 값이 싸고 손실이 적지만, 전류를 단계적으로만 조절할 수 있고 진상 방향으로만 작동한다는 한계가 있습니다.", source:[22] },
  { id:"s2-06", subject:2, term:"동기조상기", difficulty:3, def:"무부하로 돌리는 동기전동기로, 여자(계자에 흘리는 전류)를 조절해 계통에 무효전력을 더하거나 빼주는 회전형 설비입니다. 수도꼭지를 좌우로 돌려 물을 더 틀거나 잠그듯, 여자를 키우면 진상, 줄이면 지상 전류를 자유롭게 만들 수 있어요. 전력용 콘덴서와 달리 무효전력을 양방향으로 연속 조정할 수 있는 것이 큰 장점입니다.", source:[22] },
  { id:"s2-07", subject:2, term:"진상전류", difficulty:3, def:"전압보다 위상이 앞서서 흐르는 전류로, 주로 커패시터 성분에서 나타납니다. 달리기 출발 신호보다 먼저 튀어나가는 성급한 선수처럼, 전압의 변화를 앞질러 가는 전류예요. 코일이 많은 부하 때문에 뒤처진 전류(지상전류)를 보상해 역률을 1에 가깝게 만드는 데 쓰입니다.", source:[22] },
  { id:"s2-08", subject:2, term:"지상전류", difficulty:3, def:"전압보다 위상이 뒤처져서 흐르는 전류로, 코일(인덕턴스) 성분이 많은 부하에서 나타납니다. 출발 신호가 울려도 한 박자 늦게 뛰어나가는 선수처럼, 전압 변화를 따라가지 못하고 늦는 전류예요. 모터가 많은 공장 부하가 대표적이며, 동기조상기는 이 지상전류까지 흡수해 줄 수 있습니다.", source:[22] },
  { id:"s2-09", subject:2, term:"단락", difficulty:2, def:"원래 부하를 거쳐 흘러야 할 전류가, 전선끼리 직접 맞닿아 지름길로 흐르는 사고입니다. 마치 멀리 돌아가야 할 길에 갑자기 큰 구멍이 뚫려 물이 한꺼번에 쏟아지듯, 저항이 거의 없어 엄청나게 큰 전류가 흘러요. 기기를 태우거나 계통을 망가뜨릴 수 있어 빠른 차단 보호가 필수입니다.", source:[23] },
  { id:"s2-10", subject:2, term:"보호계전기", difficulty:2, def:"전류·전압을 늘 감시하다가 고장 신호를 감지하면 차단기에게 열어라 명령을 보내는 두뇌 역할 장치입니다. 화재경보기가 연기를 감지해 스프링클러를 작동시키듯, 이상을 판단해 사고 부분만 빠르게 떼어내요. 과전류·방향·거리 등 여러 종류가 있어 상황에 맞게 조합해 씁니다.", source:[23,27] },
  { id:"s2-11", subject:2, term:"방향 단락 계전기", difficulty:3, def:"고장 전류가 어느 쪽에서 흘러오는지 방향까지 따져서 동작하는 단락 보호용 계전기입니다. 양쪽에서 차가 들어오는 길목에서, 잘못된 방향으로 온 차만 골라 막는 교통경찰처럼 작동해요. 전원이 양쪽 끝에 다 있는 선로에서 과전류 계전기와 짝지어 써야 정확하게 사고 구간을 가려낼 수 있습니다.", source:[23] },
  { id:"s2-12", subject:2, term:"과전류 계전기 (OCR)", difficulty:2, def:"전류가 미리 정해둔 한계를 넘어서면 동작 신호를 내보내는 가장 기본적인 보호계전기입니다. 체중계 바늘이 일정 무게를 넘으면 빨간 영역에 들어가듯, 전류가 위험 수준을 넘으면 반응해요. 단락이나 과부하 사고를 감지하는 데 널리 쓰이며, 방향 계전기 등과 조합해 정확도를 높입니다.", source:[23] },
  { id:"s2-13", subject:2, term:"방향 거리 계전기", difficulty:3, def:"고장 지점까지의 전기적 거리(임피던스)와 전류가 흐르는 방향을 함께 판단해 동작하는 계전기입니다. 소리가 들려온 거리와 방향을 동시에 가늠해 위치를 찾는 것처럼, 어디서 얼마나 떨어진 곳에 사고가 났는지 파악해요. 전원이 두 곳 이상 있는 환상(고리 모양) 선로의 단락 보호에 사용합니다.", source:[23] },
  { id:"s2-14", subject:2, term:"선택 단락 계전기", difficulty:3, def:"여러 회선 중 어느 선로에 단락 사고가 났는지 골라내어 그 회선만 차단하도록 하는 계전기입니다. 여러 개 켜진 전등 중 고장 난 하나만 정확히 집어내는 것처럼, 사고 회선만 선별해요. 평행 2회선처럼 회선이 나란히 있는 구간의 보호에 쓰입니다.", source:[23] },
  { id:"s2-15", subject:2, term:"방사상 선로", difficulty:2, def:"발전소(전원)에서 출발한 전선이 나뭇가지처럼 한 방향으로 뻗어 나가는, 고리가 없는 배전 구조입니다. 나무 줄기에서 가지가 갈라져 나가듯 전기가 한쪽으로만 흘러요. 구조가 단순하고 값이 싸지만, 한 곳이 끊기면 그 아래 전체가 정전되는 약점이 있습니다.", source:[23] },
  { id:"s2-16", subject:2, term:"환상 선로", difficulty:2, def:"전선이 출발점으로 다시 돌아오는 고리(루프) 모양으로 연결된 배전 구조입니다. 순환 도로처럼 양쪽 길로 갈 수 있어, 한 구간이 끊겨도 반대쪽으로 전기를 계속 공급할 수 있어요. 신뢰도가 높지만 보호 방식이 복잡해 방향 거리 계전기 등이 필요합니다.", source:[23] },
  { id:"s2-17", subject:2, term:"밸런서", difficulty:3, def:"단상 3선식 배전에서 양쪽 부하가 다를 때 생기는 전압 불균형을 자동으로 바로잡아 주는 권수비 1대1의 단권변압기입니다. 시소의 한쪽이 무거워 기울 때 반대편을 살짝 눌러 수평을 맞추듯, 두 선의 전압을 같게 잡아줘요. 그래서 부하가 한쪽으로 치우치기 쉬운 단상 3선식에 설치가 꼭 필요합니다.", source:[24] },
  { id:"s2-18", subject:2, term:"단상 3선식", difficulty:2, def:"두 가닥의 전압선과 한 가닥의 중성선, 총 세 가닥으로 전기를 보내 110V와 220V를 동시에 쓸 수 있게 한 배전 방식입니다. 굵은 수도관 하나로 찬물·더운물을 함께 끌어 쓰는 것처럼, 한 설비에서 두 가지 전압을 뽑아내요. 양쪽 부하가 다르면 전압이 한쪽으로 쏠리므로 밸런서로 균형을 잡아줍니다.", source:[24] },
  { id:"s2-19", subject:2, term:"배전방식", difficulty:1, def:"발전·송전을 거쳐 온 전기를 가정과 공장 같은 최종 수용가에게 어떤 전선 구성으로 나눠 줄지를 정한 방법입니다. 큰 물탱크의 물을 각 집에 어떤 배관 구조로 나눌지 정하는 것과 같아요. 단상 2선식, 단상 3선식, 3상 3선식, 3상 4선식 등이 있으며 용도와 규모에 따라 골라 씁니다.", source:[24] },
  { id:"s2-20", subject:2, term:"차단기 (CB)", difficulty:2, def:"평소 부하전류는 물론, 단락 같은 큰 고장전류가 흐를 때도 그 전류를 안전하게 끊어낼 수 있는 개폐 장치입니다. 위급할 때 망설임 없이 핸들을 당겨 기차를 멈추는 비상 브레이크처럼, 부하가 걸린 상태에서도 회로를 딱 끊어줘요. 보호계전기의 명령을 받아 사고 구간을 신속히 분리하는 역할을 합니다.", source:[25] },
  { id:"s2-21", subject:2, term:"단로기 (DS)", difficulty:2, def:"전류가 거의 흐르지 않는 상태에서만 회로를 열고 닫아, 기기 점검·수리 시 확실히 전기를 끊어 격리하는 개폐 장치입니다. 부하전류는 못 끊으므로, 차단기로 먼저 전류를 끊은 뒤 단로기를 여는 순서를 지켜야 해요. 마치 가스레인지 불을 끈 다음에야 가스 밸브를 잠그는 것과 같은 안전 절차입니다.", source:[25] },
  { id:"s2-22", subject:2, term:"전력용 퓨즈 (PF)", difficulty:2, def:"큰 사고전류가 흐르면 내부 금속선이 스스로 녹아 끊어지면서 회로를 차단하는, 한 번 쓰면 교체해야 하는 보호 장치입니다. 일정 무게를 넘으면 끊어지도록 만든 약한 고리처럼, 정해진 한계를 넘는 전류에서 희생적으로 끊어져요. 구조가 간단하고 값이 싸 고압 기기 보호에 널리 쓰입니다.", source:[25] },
  { id:"s2-23", subject:2, term:"부하 개폐기 (LBS)", difficulty:2, def:"정상적인 부하전류 정도는 열고 닫을 수 있지만, 큰 고장전류는 차단하지 못하는 중간 성능의 개폐기입니다. 일상적인 짐은 들 수 있어도 아주 무거운 짐은 못 드는 사람처럼, 평상시 개폐는 되지만 사고 차단은 못 해요. 보통 전력용 퓨즈와 함께 설치해 사고 차단은 퓨즈가 맡습니다.", source:[25] },
  { id:"s2-24", subject:2, term:"충전전류", difficulty:3, def:"송전선이나 케이블이 가진 정전용량(커패시터 성질) 때문에, 부하가 없어도 선로에 흐르는 전류입니다. 빈 물풍선에 물을 채울 때 처음 들어가는 물처럼, 선로 자체를 전기적으로 채우는 데 쓰이는 전류예요. 선로가 길고 전압이 높을수록 커지며, 단위는 암페어(A)입니다.", source:[26] },
  { id:"s2-25", subject:2, term:"정전용량", difficulty:2, def:"두 도체가 같은 전압에서 전하를 얼마나 많이 담을 수 있는지를 나타내는 능력입니다. 컵이 클수록 물을 많이 담듯, 정전용량이 큰 만큼 더 많은 전하를 저장해요. 송전선에서는 전선과 대지·다른 전선 사이에 자연스럽게 생기며, 충전전류를 만드는 원인입니다. 단위는 패럿(F).", source:[26] },
  { id:"s2-26", subject:2, term:"선간전압", difficulty:2, def:"3상 전력에서 세 가닥의 전선 중 두 가닥 사이에서 측정한 전압입니다. 한 전선과 중성점 사이 전압(상전압)을 한 변이라 하면, 선간전압은 그 √3배가 되는 더 긴 변과 같아요. 우리가 흔히 380V 3상이라 부르는 값이 바로 선간전압이며 단위는 볼트(V).", source:[26,35] },
  { id:"s2-27", subject:2, term:"주파수", difficulty:1, def:"교류 전기에서 전압과 전류의 방향이 1초 동안 몇 번 왕복하는지를 나타내는 값입니다. 그네가 1초에 몇 번 앞뒤로 흔들리는지 세는 것과 같아요. 우리나라 전력 계통은 60Hz, 즉 1초에 60번 방향이 바뀌며 단위는 헤르츠(Hz)입니다.", source:[26] },
  { id:"s2-28", subject:2, term:"3상 송전선로", difficulty:2, def:"위상이 120도씩 어긋난 세 가닥의 교류로 전력을 보내는 송전 방식입니다. 세 사람이 박자를 번갈아 맞춰 노를 저으면 배가 끊김 없이 나아가듯, 전력이 매 순간 일정하게 전달돼요. 같은 전력을 보낼 때 전선이 덜 들어 효율적이라 대부분의 송전에 쓰입니다.", source:[26] },
  { id:"s2-29", subject:2, term:"반한시·정한시 특성", difficulty:3, def:"보호계전기의 동작 시간 특성으로, 두 성질을 합친 것입니다. 처음에는 전류가 클수록 더 빨리 동작하다가(반한시), 어느 전류를 넘으면 그 뒤로는 전류 크기와 상관없이 일정한 시간에 동작해요(정한시). 마치 달리기에서 처음엔 빠를수록 시간이 줄지만, 일정 속도를 넘으면 더는 줄지 않는 것과 비슷합니다.", source:[27] },
  { id:"s2-30", subject:2, term:"반한시 특성", difficulty:3, def:"보호계전기에서 동작전류가 커질수록 동작에 걸리는 시간이 점점 짧아지는 성질입니다. 불이 거세게 날수록 소방관이 더 급히 달려가듯, 사고가 심할수록 빨리 끊어줘요. 작은 고장은 조금 기다렸다, 큰 고장은 즉시 차단하는 합리적인 보호가 가능합니다.", source:[27] },
  { id:"s2-31", subject:2, term:"정한시 특성", difficulty:3, def:"보호계전기에서 동작전류의 크기와 상관없이 항상 똑같은 시간이 지난 뒤 동작하는 성질입니다. 전자레인지를 3분에 맞추면 음식이 무엇이든 늘 3분 뒤 멈추는 것처럼, 정해진 시간이 차야 작동해요. 동작 시간을 예측하기 쉬워 계전기들끼리 순서를 맞추는 데 유리합니다.", source:[27] },
  { id:"s2-32", subject:2, term:"전력계통의 안정도", difficulty:3, def:"발전기나 부하가 갑자기 변하거나 사고가 나도, 계통이 흔들림을 견디고 다시 안정적인 운전 상태로 돌아오는 능력입니다. 배가 파도에 기울어도 다시 균형을 잡고 똑바로 서는 복원력과 같아요. 변화가 얼마나 빠르냐에 따라 정태·과도·동태 안정도로 나눕니다.", source:[28] },
  { id:"s2-33", subject:2, term:"정태 안정도", difficulty:3, def:"부하가 아주 천천히, 조금씩 늘어나는 평상시 상황에서도 계통이 동기를 잃지 않고 안정하게 운전을 유지하는 능력입니다. 짐을 한 숟갈씩 천천히 더 얹어도 쓰러지지 않고 버티는 것과 같아요. 전력 시스템이 일상적으로 감당할 수 있는 한계를 보여줍니다.", source:[28] },
  { id:"s2-34", subject:2, term:"과도 안정도", difficulty:3, def:"단락 사고나 큰 부하 변동처럼 갑작스러운 충격을 받았을 때, 계통이 동기를 유지하며 견뎌내는 능력입니다. 누가 갑자기 어깨를 세게 밀쳐도 비틀거리다 다시 똑바로 서는 균형 감각과 같아요. 큰 사고 직후 발전기들이 보조를 잃지 않게 하는 것이 핵심입니다.", source:[28] },
  { id:"s2-35", subject:2, term:"동태 안정도", difficulty:3, def:"자동 전압 조정기(AVR) 같은 제어 장치의 도움까지 고려했을 때 계통이 유지하는 안정 능력입니다. 외줄 타기 선수가 손에 든 균형봉을 미세하게 움직여 흔들림을 잡듯, 제어 장치가 끊임없이 보정해 안정성을 높여줘요. 같은 계통이라도 동태 안정도는 정태보다 더 크게 나옵니다.", source:[28] },
  { id:"s2-36", subject:2, term:"역률", difficulty:2, def:"전원이 공급한 전체 전력(피상전력) 중에서 실제로 일을 하는 전력(유효전력)이 차지하는 비율입니다. 맥주잔에서 거품을 뺀 진짜 맥주의 비율과 비슷해요. 1(또는 100%)에 가까울수록 알차게 전기를 쓰는 것이며, 코일이 많은 부하는 역률이 낮아져 개선이 필요합니다.", source:[29,33] },
  { id:"s2-37", subject:2, term:"역률 개선", difficulty:2, def:"콘덴서 등을 설치해 낮은 역률을 1에 가깝게 끌어올리는 일입니다. 거품만 가득한 맥주잔에서 거품을 줄여 알맹이 비율을 높이는 것과 같아요. 역률이 좋아지면 전력손실과 전압강하가 줄고 설비를 더 알차게 쓸 수 있습니다.", source:[29] },
  { id:"s2-38", subject:2, term:"전력손실", difficulty:2, def:"전기를 보내는 도중 전선의 저항 때문에 열로 빠져나가 사라지는 전력입니다. 양동이로 물을 나를 때 구멍으로 새어 나가는 물처럼, 목적지에 닿기 전 손해 보는 양이에요. 전류의 제곱에 비례하므로, 역률을 높여 전류를 줄이면 손실도 크게 줄어듭니다.", source:[29,34] },
  { id:"s2-39", subject:2, term:"전압강하", difficulty:2, def:"전기가 전선을 따라 흐르며 저항과 리액턴스 때문에 전압이 점점 낮아지는 현상입니다. 긴 호스 끝에서는 수압이 약해지듯, 선로 끝(수전단)에 갈수록 전압이 떨어져요. 너무 크면 기기가 제대로 작동하지 않으므로, 콘덴서 설치 등으로 줄여줍니다.", source:[29,33] },
  { id:"s2-40", subject:2, term:"설비 이용률", difficulty:2, def:"변압기나 발전기 같은 설비가 가진 용량 중에서 실제로 얼마나 쓰이고 있는지를 나타내는 비율입니다. 8인승 차에 몇 명이 탔는지 보는 것과 같아요. 역률을 개선하면 쓸데없는 무효전력이 줄어 같은 설비로 더 많은 유효전력을 보낼 수 있어 이용률이 올라갑니다.", source:[29] },
  { id:"s2-41", subject:2, term:"저압뱅킹 방식", difficulty:3, def:"여러 변압기의 2차(저압)측을 저압선으로 서로 연결해, 부하를 함께 나눠 공급하는 배전 방식입니다. 여러 펌프를 한 배관에 연결해 어느 하나가 멈춰도 물이 계속 나오게 하는 것과 같아요. 전압 변동과 정전이 줄지만, 캐스케이딩 사고를 막을 보호 장치가 필요합니다.", source:[30] },
  { id:"s2-42", subject:2, term:"캐스케이딩 현상", difficulty:3, def:"저압뱅킹 방식에서 변압기 하나가 고장 나면 그 부담이 옆 변압기로 옮겨가고, 그것도 못 견뎌 또 끊기면서 사고가 줄줄이 퍼지는 현상입니다. 도미노가 하나 쓰러지면 옆 것까지 차례로 넘어지는 모습과 똑같아요. 변압기 사이에 구분퓨즈를 넣어 도미노의 고리를 끊어 막습니다.", source:[30] },
  { id:"s2-43", subject:2, term:"구분퓨즈", difficulty:2, def:"저압뱅킹 방식에서 이웃한 변압기를 잇는 저압선 중간에 설치하는 퓨즈입니다. 고장 난 구간을 빠르게 끊어내, 사고가 옆으로 번지는 캐스케이딩을 막아줘요. 마치 산불 확산을 막으려고 미리 나무를 베어 만든 방화선과 같은 역할을 합니다.", source:[30] },
  { id:"s2-44", subject:2, term:"리클로저", difficulty:3, def:"고장전류를 감지해 차단했다가, 잠시 뒤 스스로 다시 닫아보는 동작을 자동 반복하는 배전용 차단기입니다. 새가 잠깐 부딪혔다 날아가는 일시적 사고라면 다시 닫아 정전을 면하고, 진짜 고장이면 완전히 끊어요. 마치 막힌 듯한 문을 한두 번 다시 밀어보고 그래도 안 되면 잠그는 것과 같습니다.", source:[30] },
  { id:"s2-45", subject:2, term:"섹셔널라이저", difficulty:3, def:"고장이 난 구간을 끊어 분리하는 배전 기기로, 스스로 전류를 차단하진 못하고 리클로저와 짝을 이뤄 동작합니다. 리클로저가 잠시 전류를 끊은 무전압 순간을 노려 고장 구간을 떼어내요. 마치 신호등이 빨간불인 틈에 재빨리 길을 정비하는 작업자처럼, 안전한 순간에만 움직입니다.", source:[30] },
  { id:"s2-46", subject:2, term:"구분개폐기", difficulty:2, def:"배전선로를 여러 구간으로 나누어, 고장이나 점검 시 필요한 구간만 끊어 분리할 수 있게 하는 개폐기입니다. 긴 복도 곳곳에 문을 두어 한 구역만 닫을 수 있게 하는 것과 같아요. 사고 범위를 좁혀 정전 구역을 최소화하는 데 쓰입니다.", source:[30] },
  { id:"s2-47", subject:2, term:"승압기", difficulty:2, def:"선로 끝에서 낮아진 전압을 필요한 만큼 끌어올려 주는 단권변압기입니다. 긴 호스 끝에서 약해진 물줄기를 작은 펌프 하나로 다시 세게 만드는 것과 같아요. 자기 용량은 작아도 비교적 큰 부하의 전압을 보강할 수 있어 경제적입니다.", source:[31] },
  { id:"s2-48", subject:2, term:"자기용량", difficulty:3, def:"변압기에서 권선이 실제로 변압 작용에 쓰는 자기 자신의 용량으로, 단권변압기에서 부하용량보다 작게 나타납니다. 이삿짐을 옮길 때 짐 전부를 드는 게 아니라 일부만 들고 나머지는 미끄러뜨려 보내는 것처럼, 일부만 변압기가 감당해요. 그래서 작은 자기용량으로 큰 부하용량을 다룰 수 있습니다.", source:[31] },
  { id:"s2-49", subject:2, term:"부하용량", difficulty:2, def:"승압기 같은 설비가 실제로 공급할 수 있는 부하 쪽 전력의 크기입니다. 단권변압기에서는 권선이 직접 담당하는 자기용량보다 부하용량이 더 크게 나와요. 마치 지렛대로 작은 힘을 들여 무거운 물체를 들어 올리는 것처럼, 적은 용량으로 큰 부하를 감당하는 셈입니다. 단위는 볼트암페어(VA).", source:[31] },
  { id:"s2-50", subject:2, term:"절탄기", difficulty:3, def:"화력발전 보일러에서 배기가스의 남은 열(여열)을 이용해, 보일러로 들어가는 급수를 미리 데우는 장치입니다. 버려질 뜨거운 목욕물로 찬물을 미리 데워 연료를 아끼는 것과 같아요. 그 덕에 연료 소비가 줄고 증발량이 늘어 발전 효율이 올라갑니다.", source:[32] },
  { id:"s2-51", subject:2, term:"과열기", difficulty:3, def:"보일러에서 만들어진 젖은 증기(포화증기)를 더 가열해, 물방울이 없는 바싹 마른 고온 증기(과열증기)로 만드는 장치입니다. 축축한 빨래를 한 번 더 말려 보송보송하게 만드는 것과 같아요. 마른 증기는 터빈 날개를 부식시키지 않고 더 큰 일을 할 수 있습니다.", source:[32] },
  { id:"s2-52", subject:2, term:"공기 예열기", difficulty:2, def:"배기가스의 여열로 보일러에 들어갈 연소용 공기를 미리 데우는 장치입니다. 차가운 공기를 그대로 넣는 대신 따뜻하게 데워 넣으면 연료가 더 잘 타고 효율이 올라가요. 마치 추운 날 시동을 걸기 전 엔진을 예열해 두는 것과 같은 이치입니다.", source:[32] },
  { id:"s2-53", subject:2, term:"재열기", difficulty:3, def:"고압 터빈에서 한 차례 일을 마쳐 식고 약해진 증기를 다시 보일러로 보내 데운 뒤, 저압 터빈으로 보내는 장치입니다. 한 번 식은 국을 다시 데워 마저 먹는 것처럼, 증기를 재가열해 한 번 더 일을 시켜요. 발전 효율을 높이고 터빈 마지막 단의 습도를 줄여줍니다.", source:[32] },
  { id:"s2-54", subject:2, term:"여열 회수", difficulty:2, def:"발전소에서 그냥 버려질 뻔한 배기가스의 남은 열을 다시 붙잡아 활용하는 일입니다. 다 쓴 목욕물의 온기로 다른 물을 데우듯, 아까운 열을 한 번 더 쓰는 거예요. 절탄기·공기 예열기 등이 이 역할을 하며, 연료를 아끼고 효율을 높입니다.", source:[32] },
  { id:"s2-55", subject:2, term:"직렬콘덴서", difficulty:3, def:"송전선로에 콘덴서를 직렬로 끼워 넣어, 선로가 본래 가진 인덕턴스(리액턴스)를 상쇄하는 설비입니다. 무거운 배낭(인덕턴스)을 멘 사람에게 앞쪽에서 같은 무게로 끌어당겨 부담을 덜어주는 것과 같아요. 전압강하를 줄이고 안정도를 높여 더 많은 전력을 보낼 수 있게 합니다.", source:[33] },
  { id:"s2-56", subject:2, term:"인덕턴스", difficulty:2, def:"전선이나 코일에서 전류가 변하려 할 때 그 변화를 거스르려는 전기적 성질입니다. 무거운 짐수레는 출발도 정지도 더디듯, 인덕턴스가 크면 전류를 갑자기 바꾸기 어려워요. 송전선에도 자연히 생기며, 전압강하의 원인이 되어 직렬콘덴서로 보상합니다. 단위는 헨리(H).", source:[33] },
  { id:"s2-57", subject:2, term:"수전단", difficulty:1, def:"송전선로에서 전기를 받는 쪽 끝, 즉 전력이 도착하는 종점입니다. 택배가 출발하는 발송지에 대비되는 받는 주소와 같아요. 반대로 전기를 내보내는 쪽은 송전단이라 하며, 수전단 전압은 보통 송전단보다 낮습니다.", source:[33,35] },
  { id:"s2-58", subject:2, term:"송전단", difficulty:1, def:"송전선로에서 전기를 내보내는 쪽 끝, 즉 전력이 출발하는 시작점입니다. 택배를 부치는 발송지와 같아요. 선로 저항·리액턴스로 전압이 떨어지므로, 송전단 전압은 보통 받는 쪽인 수전단보다 높게 잡습니다.", source:[33,35] },
  { id:"s2-59", subject:2, term:"부하의 분산", difficulty:2, def:"전기를 쓰는 부하가 선로의 한 지점에 몰려 있지 않고, 선로 전체에 고르게 퍼져 걸려 있는 상태입니다. 다리 위에 사람들이 한 곳에 모이지 않고 골고루 흩어져 선 모습과 같아요. 같은 총량이라도 분산돼 있으면 말단 집중 부하보다 전력손실이 3분의 1로 줄어듭니다.", source:[34] },
  { id:"s2-60", subject:2, term:"상차각", difficulty:3, def:"송전단 전압과 수전단 전압 사이의 위상(파동의 박자) 차이를 각도로 나타낸 값입니다. 두 사람이 같은 노래를 부를 때 한쪽이 얼마나 늦거나 빠른지를 박자 차이로 보는 것과 같아요. 이 각이 클수록 더 많은 전력이 흐르지만, 너무 커지면 계통이 동기를 잃어 불안정해집니다. 단위는 도(°).", source:[35] },
  { id:"s2-61", subject:2, term:"리액턴스", difficulty:2, def:"교류 회로에서 코일이나 콘덴서가 전류 흐름을 방해하는 정도로, 저항과 달리 전력을 열로 소비하지 않습니다. 회전문이 사람을 막진 않아도 통과 속도를 늦추는 것과 비슷해요. 송전선의 리액턴스는 전송할 수 있는 전력의 크기를 좌우하며 단위는 옴(Ω)입니다.", source:[35] },
  { id:"s2-62", subject:2, term:"전송전력", difficulty:2, def:"송전선로를 통해 송전단에서 수전단으로 실제 보내지는 전력의 양입니다. 송수전단 전압의 곱에 상차각의 사인값을 곱하고 리액턴스로 나눈 값으로 정해져요. 마치 양쪽 호수의 높이차가 클수록 물이 많이 흐르듯, 전압과 위상차가 클수록 더 많은 전력이 흐릅니다. 단위는 메가와트(MW).", source:[35] },
  { id:"s2-63", subject:2, term:"직접접지방식", difficulty:3, def:"변압기 중성점을 저항이나 코일 없이 도선으로 곧장 땅에 연결하는 접지 방식입니다. 한 상이 땅에 닿는 사고가 나도 멀쩡한 상의 전압이 거의 안 올라가, 절연 수준을 낮춰 경제적으로 만들 수 있어요. 다만 큰 지락전류가 흘러 통신선 유도 장해와 차단기 부담이 커집니다.", source:[36] },
  { id:"s2-64", subject:2, term:"1선 지락", difficulty:3, def:"3상 전선 중 한 가닥이 나무·땅 등에 닿아 전류가 대지로 새어 흐르는 사고입니다. 욕조에서 한 곳이 깨져 물이 바닥으로 새는 것과 같아요. 가장 흔한 사고 유형이며, 접지 방식에 따라 멀쩡한 상의 전압 상승 정도와 지락전류 크기가 달라집니다.", source:[36] },
  { id:"s2-65", subject:2, term:"건전상", difficulty:2, def:"3상 중 한 상에 사고가 났을 때, 사고가 나지 않고 정상으로 남아 있는 나머지 상을 가리킵니다. 세 명 중 한 명이 다쳤을 때 멀쩡한 두 사람과 같아요. 직접접지방식에서는 1선 지락 시 이 건전상의 전압이 거의 오르지 않는 것이 장점입니다.", source:[36] },
  { id:"s2-66", subject:2, term:"대지전압", difficulty:2, def:"전선과 땅(대지) 사이에서 측정한 전압입니다. 건물의 어느 층 높이를 1층 바닥이 아니라 땅바닥을 기준으로 재는 것과 같아요. 1선 지락 사고가 나면 멀쩡한 상의 대지전압이 올라갈 수 있는데, 직접접지방식은 이 상승을 작게 억제합니다. 단위는 볼트(V).", source:[36] },
  { id:"s2-67", subject:2, term:"절연수준", difficulty:3, def:"기기나 선로가 견디도록 설계된 전압의 한계, 즉 절연을 얼마나 튼튼하게 만들었는지의 기준입니다. 댐을 얼마나 높은 수위까지 견디게 쌓을지 정하는 것과 같아요. 직접접지방식은 사고 시 전압 상승이 작아 절연수준을 낮게 잡을 수 있어 비용을 아낍니다.", source:[36] },
  { id:"s2-68", subject:2, term:"단절연", difficulty:3, def:"변압기 권선에서 중성점에 가까운 부분일수록 전압이 낮으므로, 그쪽 절연을 얇게 줄여 만드는 기법입니다. 수압이 약한 수도관 윗부분은 얇게, 센 아랫부분은 두껍게 만드는 것과 같아요. 중성점 전위가 거의 0인 직접접지방식에서만 가능하며 변압기를 더 싸고 가볍게 합니다.", source:[36] },
  { id:"s2-69", subject:2, term:"이도 (처짐, sag)", difficulty:3, def:"전선이 두 지지점 사이에 걸릴 때 자기 무게로 아래로 처지는 정도, 즉 가장 낮은 점이 지지점보다 얼마나 내려갔는지의 값입니다. 빨랫줄에 무거운 빨래를 널면 가운데가 축 처지는 그 깊이와 같아요. 너무 작으면 전선이 끊어지기 쉽고, 너무 크면 다른 물체에 닿을 수 있어 적절히 잡습니다. 단위는 보통 미터나 센티미터.", source:[37] },
  { id:"s2-70", subject:2, term:"경간 (span)", difficulty:2, def:"전선을 지지하는 두 철탑(또는 전주) 사이의 수평 거리입니다. 다리 기둥과 기둥 사이의 간격과 같아요. 경간이 길수록 전선이 더 많이 처지므로(이도가 커지므로), 경간과 이도는 서로 맞물려 설계됩니다. 단위는 미터(m).", source:[37] },
  { id:"s2-71", subject:2, term:"지지점", difficulty:1, def:"전선을 공중에 매달아 받쳐 주는 지점으로, 보통 철탑이나 전주 위 애자가 있는 곳입니다. 빨랫줄을 묶어 매다는 양쪽 기둥과 같아요. 지지점 사이가 경간이고, 그 사이에서 전선이 처진 깊이가 이도입니다.", source:[37] },
  { id:"s2-72", subject:2, term:"수차", difficulty:2, def:"높은 곳에서 떨어지거나 흐르는 물의 힘을 받아 회전하면서, 물의 에너지를 회전 운동으로 바꾸는 기계입니다. 옛날 물레방아가 냇물을 맞아 도는 것과 똑같은 원리예요. 수력발전소에서 발전기를 돌리는 동력원으로 쓰입니다.", source:[38] },
  { id:"s2-73", subject:2, term:"캐비테이션 (공동현상)", difficulty:3, def:"수차 안에서 물의 압력이 갑자기 너무 낮아진 곳에 작은 기포가 생겼다가 터지면서, 금속 표면을 조금씩 깎아내고 진동·소음을 일으키는 현상입니다. 물이 끓을 때 생긴 기포가 톡톡 터지며 냄비 벽을 때리는 것과 비슷해요. 수차의 수명을 줄이므로 흡출수두를 낮추는 등으로 막습니다.", source:[38] },
  { id:"s2-74", subject:2, term:"흡출수두", difficulty:3, def:"수차의 러너 출구에서 방수면(아래쪽 물 표면)까지의 높이 차이입니다. 빨대를 물 위로 너무 높이 들면 빨아올리기 힘들어지듯, 이 높이가 크면 출구 압력이 낮아져 캐비테이션이 잘 생겨요. 그래서 캐비테이션을 막으려면 흡출수두를 작게 잡아야 합니다. 단위는 미터(m).", source:[38] },
  { id:"s2-75", subject:2, term:"비속도", difficulty:3, def:"수차나 펌프의 형태가 얼마나 빠른 속도형인지를 나타내는 설계 지표입니다. 같은 종류의 차라도 경주용·화물용 체급을 나누는 기준 숫자와 비슷해요. 비속도를 너무 크게 잡으면 캐비테이션이 잘 생기므로 적당한 값으로 제한합니다.", source:[38] },
  { id:"s2-76", subject:2, term:"러너 (runner)", difficulty:2, def:"수차에서 물을 직접 맞아 회전하는 날개 부분, 즉 수차의 핵심 회전체입니다. 선풍기에서 실제로 도는 날개에 해당해요. 캐비테이션으로 깎여 손상되기 쉬워, 침식에 강한 금속으로 만들어 수명을 늘립니다.", source:[38] },
  { id:"s2-77", subject:2, term:"매설지선", difficulty:3, def:"철탑 발밑의 땅속에 묻어 사방으로 뻗어 두는 도선으로, 철탑의 접지저항을 낮추는 역할을 합니다. 나무가 뿌리를 넓게 뻗어 땅을 단단히 붙잡듯, 땅과의 접촉을 넓혀 전기가 잘 빠지게 해요. 낙뢰 때 철탑 전위가 치솟는 것을 막아 역섬락을 예방합니다.", source:[39] },
  { id:"s2-78", subject:2, term:"직격뇌", difficulty:3, def:"번개가 다른 곳을 거치지 않고 송전선이나 철탑에 곧장 내리치는 낙뢰입니다. 우산 없이 비를 정통으로 맞는 것과 같아요. 엄청난 전압을 일으켜 정전이나 기기 손상을 부르므로, 가공지선으로 전선 위를 막아 보호합니다.", source:[39] },
  { id:"s2-79", subject:2, term:"차폐보호", difficulty:3, def:"송전선 위쪽에 가공지선 같은 도선을 쳐서, 번개가 송전선에 직접 떨어지지 않도록 대신 막아 주는 보호 방법입니다. 우산을 머리 위에 펴서 비를 대신 맞아 주는 것과 같아요. 가공지선이 직격뇌를 받아내 아래 송전선을 지킵니다.", source:[39] },
  { id:"s2-80", subject:2, term:"현수애자", difficulty:2, def:"전선을 철탑에 매달면서 전기가 철탑으로 새지 않게 절연해 주는, 접시 모양 절연체를 여러 개 이어 만든 부품입니다. 뜨거운 냄비를 들 때 쓰는 절연 손잡이가 여러 개 사슬처럼 이어진 모습이에요. 전압이 높을수록 더 많은 개수를 연결해 씁니다.", source:[39] },
  { id:"s2-81", subject:2, term:"역섬락", difficulty:3, def:"낙뢰가 철탑이나 가공지선에 떨어졌을 때 철탑 전위가 급상승해, 거꾸로 철탑에서 송전선 쪽으로 절연을 뚫고 방전이 튀는 현상입니다. 보통은 전선에서 철탑으로 새는데 방향이 반대라 역(逆)섬락이에요. 매설지선으로 철탑 접지저항을 낮추면 이를 막을 수 있습니다.", source:[39] },
  { id:"s2-82", subject:2, term:"4단자 정수", difficulty:3, def:"송전선로처럼 입력 2단자와 출력 2단자를 가진 회로를 A·B·C·D 네 개의 상수로 요약해, 송전단과 수전단의 전압·전류 관계를 간단히 나타낸 것입니다. 복잡한 기계를 입력을 넣으면 출력이 이렇게 나온다는 변환표로 압축한 것과 같아요. 선로 해석을 크게 단순하게 해 줍니다.", source:[40] },
  { id:"s2-83", subject:2, term:"여자 어드미턴스", difficulty:3, def:"변압기에서 철심을 자화시키는 데 쓰이는 여자전류와 관련된 어드미턴스(전류가 흐르기 쉬운 정도)입니다. 자전거가 굴러가기 시작하려면 처음에 약간의 헛도는 힘이 드는 것처럼, 변압기도 철심을 자화시키느라 작은 전류를 써요. 값이 매우 작아 4단자 정수 계산에서는 흔히 무시합니다.", source:[40] },
  { id:"s2-84", subject:2, term:"변압기", difficulty:1, def:"전자기 유도를 이용해 교류 전압을 더 높이거나 낮춰 주는 기기입니다. 자전거 기어처럼, 같은 힘(전력)을 전달하면서 속도(전압)와 회전수(전류)의 비율만 바꿔 줘요. 발전소의 전압을 높여 멀리 보내고, 가정 앞에서 다시 낮추는 송배전의 필수 장비입니다.", source:[40] },
  { id:"s3-01", subject:3, term:"단상 변압기", difficulty:1, def:"1차 코일에 들어온 한 종류(단상) 교류 전압을 자기장을 통해 2차 코일로 옮기면서 전압을 높이거나 낮추는 장치입니다. 마치 큰 컵의 물을 작은 컵으로 옮겨 담듯, 전기를 직접 잇지 않고 자기장이라는 다리를 통해 옮겨요. 가정용 어댑터처럼 우리 생활 곳곳에 쓰입니다.", source:[41] },
  { id:"s3-02", subject:3, term:"무부하 상태", difficulty:1, def:"기기에 전원은 연결되어 있지만 실제로 일을 시키는 부하(전동기, 전등 등)는 달지 않은 상태입니다. 자동차 시동만 걸어놓고 기어는 중립에 둔 것처럼, 돌아가긴 해도 바깥일은 안 하는 상태예요. 변압기에서는 이때 흐르는 작은 전류로 철심 손실을 알 수 있습니다.", source:[41] },
  { id:"s3-03", subject:3, term:"무부하손 (철손)", difficulty:2, def:"부하가 없어도 변압기에 전원만 넣으면 철심 안에서 꾸준히 새어나가는 손실입니다. 시동만 켜둔 자동차가 가만히 있어도 기름을 조금씩 쓰듯, 변압기도 켜져 있기만 하면 철심에서 열로 에너지를 잃어요. 단위는 와트(W).", source:[41] },
  { id:"s3-04", subject:3, term:"고조파 (3고조파)", difficulty:3, def:"기본 주파수의 정수배(3배, 5배 등)로 함께 섞여 들어오는 일그러진 파형 성분입니다. 깨끗한 하나의 음에 잡음 같은 배음이 끼어드는 것처럼, 변압기 전류에도 3배 빠른 물결이 섞여 파형을 찌그러뜨려요. 문제의 전류식에서 3ωt 항이 바로 3고조파입니다.", source:[41] },
  { id:"s3-05", subject:3, term:"단상 직권 정류자 전동기", difficulty:3, def:"전기자 권선과 계자 권선이 한 줄로 직렬 연결되어 단상 교류로도 돌아가는 전동기입니다. 한 호스에 물이 차례로 흐르듯 같은 전류가 두 권선을 잇따라 지나요. 토크가 크고 회전수를 높일 수 있어 옛 전기철도나 소형 공구에 쓰였습니다.", source:[42] },
  { id:"s3-06", subject:3, term:"전기자 권선", difficulty:2, def:"전동기나 발전기에서 실제로 전류가 흘러 회전력(또는 전압)을 만들어내는 주된 코일입니다. 자전거에서 발로 직접 미는 페달 같은 역할로, 힘을 내는 핵심 부분이에요. 보통 회전하는 부분(전기자)에 감겨 있습니다.", source:[42] },
  { id:"s3-07", subject:3, term:"계자 권선", difficulty:2, def:"전동기·발전기 안에 자기장(자속)을 만들어 주는 코일입니다. 무대 위 배우가 잘 보이도록 비춰주는 조명처럼, 계자 권선은 전기자가 힘을 낼 수 있는 자기장 무대를 깔아줘요. 이 자기장이 강할수록 같은 전류로도 더 큰 토크가 납니다.", source:[42] },
  { id:"s3-08", subject:3, term:"역률 저하", difficulty:2, def:"전압과 전류의 위상이 어긋나 공급한 전력 중 실제로 일에 쓰이는 비율이 떨어지는 현상입니다. 짐을 비스듬히 끌면 힘의 일부만 앞으로 가듯, 위상이 어긋나면 전기의 일부만 유용하게 쓰여요. 단상 정류자 전동기에서는 이를 막으려고 설계를 신경 씁니다.", source:[42] },
  { id:"s3-09", subject:3, term:"변압기 기전력", difficulty:3, def:"전동기 코일이 교류 자속의 변화 때문에 변압기처럼 스스로 만들어내는 유도 전압입니다. 빙빙 도는 회전문에 옆에서 부는 바람처럼, 정류자 전동기에서는 이 전압이 정류를 방해해 불꽃과 역률 저하를 일으켜요. 그래서 가능한 작게 설계합니다.", source:[42] },
  { id:"s3-10", subject:3, term:"단락전류", difficulty:2, def:"저항이 거의 없는 짧은 통로(단락)가 생겼을 때 그곳으로 갑자기 크게 흐르는 전류입니다. 막힌 댐의 수문이 활짝 열려 물이 한꺼번에 쏟아지는 것과 같아요. 정류자 전동기에서 브러시가 코일을 단락시킬 때 이 전류가 크면 불꽃이 심해집니다.", source:[42] },
  { id:"s3-11", subject:3, term:"직류발전기", difficulty:1, def:"회전 운동을 받아 한 방향으로만 흐르는 직류 전압을 만들어내는 발전기입니다. 손으로 돌리는 손전등 발전기처럼, 돌리면 일정한 방향의 전기가 나와요. 계자를 어떻게 연결하느냐에 따라 분권·복권 등 종류가 나뉩니다.", source:[43] },
  { id:"s3-12", subject:3, term:"단자전압", difficulty:1, def:"발전기나 전동기의 바깥 연결 단자에서 실제로 측정되는 전압입니다. 수도꼭지 끝에서 실제로 나오는 물의 세기와 같아요. 내부에서 만든 전압에서 손실만큼 빠지거나 더해져 단자에 나타납니다. 단위는 볼트(V).", source:[43] },
  { id:"s3-13", subject:3, term:"분권발전기", difficulty:2, def:"계자 권선을 전기자와 나란히(병렬) 연결한 직류발전기입니다. 큰 도로 옆에 샛길이 갈라져 나가듯, 전류 일부가 계자로 분기해 흐른다고 해서 분권이라 불러요. 부하가 늘면 단자전압이 조금 떨어지는 특성이 있습니다.", source:[43] },
  { id:"s3-14", subject:3, term:"평복권발전기", difficulty:2, def:"직권·분권 계자를 함께 가진 복권발전기 중에서, 부하가 없을 때와 가득 찼을 때의 단자전압이 거의 같도록 균형 맞춘 종류입니다. 시소 양쪽에 똑같은 무게를 올려 수평을 맞춘 것처럼 전압이 평평하게 유지돼요. 안정적인 전압이 필요할 때 유리합니다.", source:[43] },
  { id:"s3-15", subject:3, term:"과복권발전기", difficulty:2, def:"직권 계자의 작용을 일부러 세게 만들어, 부하가 클 때 단자전압이 무부하 때보다 오히려 더 높아지는 복권발전기입니다. 사람이 많이 탈수록 더 힘껏 미는 버스처럼요. 먼 거리 송전 중 생기는 전압강하를 미리 보상하는 데 쓰입니다.", source:[43] },
  { id:"s3-16", subject:3, term:"차동복권발전기", difficulty:3, def:"직권 계자와 분권 계자의 자속이 서로 빼는 방향으로 작용하도록 만든 복권발전기입니다. 두 사람이 줄을 반대로 잡아당기는 것처럼 자속이 상쇄돼, 부하가 늘수록 전압이 크게 떨어져요. 용접기처럼 전류를 일정하게 유지하고 싶을 때 사용합니다.", source:[43] },
  { id:"s3-17", subject:3, term:"중권 (직류기 권선법)", difficulty:3, def:"직류기 전기자 코일을 감을 때, 코일의 끝을 바로 옆 정류자편에 이어 겹쳐 감아 나가는 방식입니다. 계단을 한 칸씩 차근차근 밟아 올라가는 모습과 비슷해요. 병렬 회로 수가 극수만큼 많아져 큰 전류·낮은 전압 기기에 적합합니다.", source:[44] },
  { id:"s3-18", subject:3, term:"전기자 병렬회로 수 a", difficulty:3, def:"전기자 권선 안에서 전류가 갈라져 흐를 수 있는 길의 개수입니다. 톨게이트 요금소 창구가 많을수록 차가 분산되듯, 병렬회로 수가 많으면 전류가 여러 갈래로 나뉘어 흘러요. 중권에서는 다중도 m과 극수 P를 곱한 값(a = mP)이 됩니다.", source:[44] },
  { id:"s3-19", subject:3, term:"극수 P", difficulty:1, def:"전동기·발전기 안에 만들어 놓은 자석 극(N극·S극)의 총 개수입니다. 회전목마에 매단 말의 수처럼, 극이 많을수록 한 바퀴 도는 동안 더 잘게 나뉘어 작동해요. 회전 속도와 권선 구조를 정하는 기본 값입니다.", source:[44] },
  { id:"s3-20", subject:3, term:"다중도 m", difficulty:3, def:"직류기 권선을 같은 방식으로 몇 겹 겹쳐 감았는지를 나타내는 수입니다. 한 줄로 갈 길을 두세 줄로 늘려 깐 도로처럼, 다중도가 크면 전류 통로가 그만큼 배로 늘어나요. 중권에서 병렬회로 수는 다중도와 극수의 곱이 됩니다.", source:[44] },
  { id:"s3-21", subject:3, term:"슬립 (slip)", difficulty:2, def:"유도전동기에서 회전자가 자기장(동기속도)보다 얼마나 뒤처져 도는지를 비율로 나타낸 값입니다. 앞서가는 친구를 조금 못 따라잡고 뒤따르는 것처럼, 회전자는 항상 동기속도보다 살짝 느려요. 이 처짐이 있어야 토크가 생기며 보통 백분율로 씁니다.", source:[45,48] },
  { id:"s3-22", subject:3, term:"최대 토크", difficulty:2, def:"유도전동기가 낼 수 있는 회전력 중 가장 큰 값입니다. 자전거 페달을 가장 힘이 잘 실리는 각도에서 밟을 때처럼, 특정 슬립에서 토크가 최고에 이르러요. 이보다 부하가 더 커지면 오히려 전동기가 멈춰버립니다.", source:[45,49] },
  { id:"s3-23", subject:3, term:"3상 유도전동기", difficulty:1, def:"세 가닥(3상) 교류 전기로 회전 자기장을 만들어 그 힘으로 회전자를 끌고 도는 전동기입니다. 회전목마 주위를 세 사람이 번갈아 밀어주면 자연스럽게 도는 것과 같아요. 구조가 튼튼하고 값이 싸 산업 현장에서 가장 많이 쓰입니다.", source:[45,48,49,60] },
  { id:"s3-24", subject:3, term:"2차측 저항", difficulty:2, def:"유도전동기의 회전자(2차) 쪽 권선이 가진 전기 저항입니다. 미끄럼틀에 깔아 둔 마찰 천처럼, 이 저항을 조절하면 전동기의 기동 특성과 토크가 나오는 시점을 바꿀 수 있어요. 권선형 전동기는 바깥에서 저항을 더 넣어 기동을 부드럽게 합니다.", source:[45,49] },
  { id:"s3-25", subject:3, term:"기동 (전동기 기동)", difficulty:1, def:"멈춰 있던 전동기를 처음 돌리기 시작하는 순간을 말합니다. 무거운 짐수레를 처음 밀 때 가장 큰 힘이 들듯, 전동기도 기동 순간에 전류가 크게 흘러요. 그래서 기동 전류를 줄이거나 토크를 키우는 여러 기동법을 씁니다.", source:[45,49] },
  { id:"s3-26", subject:3, term:"병렬 운전", difficulty:2, def:"변압기나 발전기 두 대 이상을 같은 부하에 함께 연결해 나눠 일하게 하는 운전 방식입니다. 무거운 짐을 여러 사람이 나눠 드는 것과 같아요. 다만 용량에 맞게 부하가 공평히 나뉘도록 임피던스 등 조건을 맞춰야 합니다.", source:[46] },
  { id:"s3-27", subject:3, term:"누설 임피던스", difficulty:3, def:"변압기에서 자속 일부가 철심을 벗어나 새어나가며 생기는, 전류 흐름을 방해하는 성분입니다. 물통에서 옆으로 조금씩 새는 물처럼, 모든 자속이 2차로 전달되지 못하고 빠져나가요. 병렬 운전 시 부하 분담은 이 값에 반비례합니다.", source:[46] },
  { id:"s3-28", subject:3, term:"누설 리액턴스", difficulty:3, def:"누설된 자속이 만들어내는 임피던스 중 교류를 방해하는 부분입니다. 잘 닫히지 않는 문틈으로 새는 바람처럼, 새어나간 자속이 코일에 추가 방해 작용을 해요. 변압기 전압강하와 단락전류 크기를 결정하는 중요한 값입니다.", source:[46] },
  { id:"s3-29", subject:3, term:"스텝 모터 (step motor)", difficulty:2, def:"전기 펄스 신호 하나가 들어올 때마다 정해진 각도만큼 똑딱똑딱 회전하는 전동기입니다. 시계 초침이 한 칸씩 정확히 넘어가는 모습과 같아요. 펄스 수만 세면 위치를 알 수 있어 프린터·로봇의 정밀 위치 제어에 쓰입니다.", source:[47] },
  { id:"s3-30", subject:3, term:"오픈 루프 (개루프) 제어", difficulty:2, def:"출력 결과를 다시 확인(피드백)하지 않고 입력 명령만으로 작동시키는 제어 방식입니다. 뒤를 돌아보지 않고 정해진 걸음 수만큼 걷는 것과 같아요. 스텝 모터는 펄스만 정확히 보내면 개루프로도 위치를 맞출 수 있습니다.", source:[47] },
  { id:"s3-31", subject:3, term:"피드백 (feedback)", difficulty:2, def:"출력 결과를 다시 입력 쪽으로 되돌려 보내, 목표와 얼마나 차이 나는지 확인하며 바로잡는 것입니다. 운전 중 자꾸 앞을 살피며 핸들을 미세하게 고치는 것과 같아요. 정밀 제어에 꼭 필요하지만 스텝 모터는 이것 없이도 동작할 수 있습니다.", source:[47] },
  { id:"s3-32", subject:3, term:"전부하", difficulty:1, def:"기기가 설계상 견디도록 정해진 최대 정격 부하를 모두 걸어 운전하는 상태입니다. 트럭에 실을 수 있는 짐을 정량까지 가득 실은 것과 같아요. 전부하 슬립, 전부하 손실처럼 기기 성능을 따질 때 기준이 되는 운전점입니다.", source:[48,56] },
  { id:"s3-33", subject:3, term:"직류 분권전동기", difficulty:2, def:"계자 권선을 전기자와 병렬로 연결한 직류전동기입니다. 큰길과 샛길이 나란히 갈라지듯 전류가 두 갈래로 나뉘어요. 부하가 변해도 회전 속도가 비교적 일정해서, 속도를 안정적으로 유지하고 싶은 곳에 적합합니다.", source:[50,51] },
  { id:"s3-34", subject:3, term:"정출력 제어", difficulty:3, def:"속도가 변해도 전동기가 내는 출력(힘과 속도의 곱)을 일정하게 유지하는 제어 방식입니다. 자전거에서 빨리 갈 땐 가볍게, 천천히 갈 땐 무겁게 기어를 바꿔 페달 힘을 일정하게 두는 것과 같아요. 분권전동기의 계자제어가 대표적인 방법입니다.", source:[50] },
  { id:"s3-35", subject:3, term:"계자제어 (속도제어법)", difficulty:2, def:"계자 전류를 조절해 자속의 세기를 바꿔 전동기 속도를 조절하는 방법입니다. 선풍기 바람을 막는 천을 걷어내듯 자속을 줄이면 회전이 빨라져요. 출력은 거의 그대로 두면서 속도를 바꿀 수 있어 정출력 가변속에 적합합니다.", source:[50] },
  { id:"s3-36", subject:3, term:"전압제어 (속도제어법)", difficulty:2, def:"전동기에 거는 전압의 크기를 바꿔 회전 속도를 조절하는 방법입니다. 수도꼭지를 더 열거나 잠가 물줄기 세기를 바꾸는 것과 같아요. 넓은 범위로 속도를 부드럽게 바꿀 수 있어 정밀 속도제어에 많이 쓰입니다.", source:[50] },
  { id:"s3-37", subject:3, term:"극수제어 (속도제어법)", difficulty:2, def:"전동기 내부 자극의 개수를 바꿔 회전 속도를 단계적으로 조절하는 방법입니다. 자전거 기어를 1단·2단으로 바꿔 속도 단을 고르는 것과 같아요. 연속적이지 않고 정해진 몇 단계로만 속도가 바뀝니다.", source:[50] },
  { id:"s3-38", subject:3, term:"토크 (회전력)", difficulty:1, def:"축을 돌리려는 회전의 힘으로, 전동기가 얼마나 세게 돌리는지를 나타냅니다. 문손잡이를 멀리 잡고 돌릴수록 잘 열리듯, 힘과 팔 길이를 곱한 값이에요. 직류전동기에서는 자속과 전기자전류의 곱에 비례하며 단위는 뉴턴미터(N·m).", source:[51] },
  { id:"s3-39", subject:3, term:"전기자전류", difficulty:2, def:"전기자 권선에 실제로 흐르는 전류로, 전동기가 내는 토크의 크기를 좌우합니다. 페달을 밟는 발의 힘처럼, 이 전류가 클수록 더 센 회전력이 나와요. 직류 분권전동기의 토크는 자속과 전기자전류의 곱에 비례합니다. 단위는 암페어(A).", source:[51] },
  { id:"s3-40", subject:3, term:"자속 (계자 자속)", difficulty:2, def:"계자가 만들어내는 자기장의 양으로, 전동기 안을 지나가는 자기력선의 다발입니다. 강물의 물줄기 굵기처럼, 자속이 굵을수록 같은 전류로도 더 큰 토크가 나요. 자속이 80%로 줄면 토크도 그만큼 줄어듭니다. 단위는 웨버(Wb).", source:[51] },
  { id:"s3-41", subject:3, term:"권수비 (변압비)", difficulty:2, def:"변압기 1차 코일과 2차 코일의 감은 횟수 비율로, 전압을 얼마나 바꿀지를 정합니다. 자전거 앞뒤 톱니바퀴 잇수 비처럼, 이 비가 크면 전압이 그만큼 크게 변해요. 전압은 권수비에 비례하고 전류는 반비례합니다.", source:[52] },
  { id:"s3-42", subject:3, term:"△ 결선 (델타 결선)", difficulty:2, def:"3상 변압기 세 권선의 끝과 끝을 삼각형 모양으로 이어 붙인 연결 방식입니다. 세 사람이 손을 잡고 삼각형으로 둘러선 모습과 같아요. 선간전압과 상전압이 같아 큰 전류를 다루기에 유리합니다.", source:[52] },
  { id:"s3-43", subject:3, term:"Y 결선 (성형 결선)", difficulty:2, def:"3상 변압기 세 권선의 한쪽 끝을 한 점(중성점)에 모아 별 모양으로 잇는 연결 방식입니다. 세 사람이 가운데로 손을 모은 모습과 같아요. 선간전압이 상전압의 √3배라 높은 전압을 다루기에 유리합니다.", source:[52] },
  { id:"s3-44", subject:3, term:"선전류", difficulty:2, def:"3상 회로에서 전원과 부하를 잇는 바깥 선(전선)에 실제로 흐르는 전류입니다. 건물로 들어오는 큰 수도관 속 물처럼, 각 권선 안을 흐르는 상전류와는 구별돼요. Y결선에서는 선전류와 상전류가 같고, △결선에서는 √3배 차이가 납니다.", source:[52] },
  { id:"s3-45", subject:3, term:"여자전류", difficulty:3, def:"변압기나 발전기에서 철심에 자기장을 일으키기 위해 따로 흘려주는 전류입니다. 악기를 연주하기 전 줄을 미리 팽팽히 조여 두는 것과 같아요. 발전기에서는 이 전류를 키우면 만들어내는 전압이 커집니다.", source:[52,56] },
  { id:"s3-46", subject:3, term:"SCR (실리콘 제어 정류기)", difficulty:2, def:"게이트에 신호를 한 번 주면 켜져서 한 방향으로만 전류를 흘리는 반도체 스위치입니다. 한 번 누르면 켜지고 전류가 멈춰야 꺼지는 빗장 같은 소자예요. 단방향 3단자 사이리스터로, 정류와 위상 제어에 널리 쓰입니다.", source:[53,59] },
  { id:"s3-47", subject:3, term:"3상 반파정류회로", difficulty:3, def:"3상 교류의 각 상에서 양(+)의 절반 부분만 골라내 직류로 만드는 정류 회로입니다. 세 개의 물결에서 위로 솟은 부분만 차례로 떠내 합치는 것과 같아요. 출력이 비교적 매끈한 직류에 가까워집니다.", source:[53] },
  { id:"s3-48", subject:3, term:"위상각 (점호각)", difficulty:3, def:"SCR 같은 소자를 교류 한 주기 중 어느 시점에 켤지를 각도로 나타낸 값입니다. 회전문을 몇 시 방향에서 통과시킬지 정하는 것과 같아요. 이 각도를 늦출수록 출력 전압의 평균값이 작아집니다. 단위는 도(°).", source:[53] },
  { id:"s3-49", subject:3, term:"출력전압 평균값", difficulty:2, def:"정류회로에서 시간에 따라 오르내리는 출력 전압을 평탄하게 고른 평균 크기입니다. 들쭉날쭉한 산봉우리를 깎아 평지 높이로 환산한 것과 같아요. 위상각을 조절하면 이 평균값을 원하는 대로 바꿀 수 있습니다. 단위는 볼트(V).", source:[53] },
  { id:"s3-50", subject:3, term:"순 저항부하", difficulty:2, def:"코일이나 커패시터 성분 없이 순수하게 저항만으로 이루어진 부하입니다. 전열기나 백열전구처럼 전류와 전압의 위상이 어긋나지 않아요. 정류회로 계산에서 가장 기본이 되는 단순한 부하 조건입니다.", source:[53] },
  { id:"s3-51", subject:3, term:"유도자형 동기발전기", difficulty:3, def:"계자극과 전기자가 모두 고정되어 있고, 이 사이에서 톱니 모양 유도자만 회전하며 자속을 변하게 해 전기를 만드는 발전기입니다. 풍차 날개는 그대로 두고 바람만 도는 듯한 특이한 구조예요. 고주파 발전 같은 특수 용도에 쓰입니다.", source:[54] },
  { id:"s3-52", subject:3, term:"동기발전기", difficulty:2, def:"회전자가 자기장과 똑같은 속도(동기속도)로 돌면서 일정한 주파수의 교류 전기를 만드는 발전기입니다. 행진할 때 모두 같은 박자로 발을 맞추는 것과 같아요. 발전소에서 우리 집까지 오는 전기 대부분이 이렇게 만들어집니다.", source:[54,55,56,58] },
  { id:"s3-53", subject:3, term:"전기자 (고정자/회전자)", difficulty:2, def:"발전기·전동기에서 전압이 유도되거나 전류가 흘러 힘을 만드는 권선이 자리한 핵심 부분입니다. 발전기 종류에 따라 도는 쪽일 수도, 멈춰 있는 쪽일 수도 있어요. 마치 공연의 주인공처럼, 실제 전기 작용이 일어나는 무대입니다.", source:[54] },
  { id:"s3-54", subject:3, term:"계자극", difficulty:2, def:"발전기·전동기에서 자기장을 만들어내는 자석 극 부분입니다. 무대를 비추는 조명 기둥처럼, 전기자가 일할 수 있도록 자기장을 깔아줘요. 보통 회전하지만 유도자형 발전기에서는 고정되어 있습니다.", source:[54] },
  { id:"s3-55", subject:3, term:"동기임피던스", difficulty:3, def:"동기발전기 내부에서 전류 흐름을 방해하는 저항·리액턴스 성분을 합쳐 나타낸 값입니다. 호스 안쪽의 좁아진 부분처럼, 부하가 걸렸을 때 전압을 떨어뜨리는 원인이에요. 정격전압을 단락전류로 나누어 구하며 단위는 옴(Ω).", source:[55] },
  { id:"s3-56", subject:3, term:"3상 단락전류", difficulty:3, def:"동기발전기의 세 출력 단자를 한꺼번에 단락시켰을 때 흐르는 전류입니다. 막힌 수문 세 개를 동시에 활짝 열었을 때 쏟아지는 물과 같아요. 이 값으로 발전기의 동기임피던스와 단락비를 알아냅니다. 단위는 암페어(A).", source:[55,56] },
  { id:"s3-57", subject:3, term:"단락비 Ks", difficulty:3, def:"동기발전기에서 무부하 정격전압을 만드는 여자전류를, 정격전류만큼의 단락전류를 만드는 여자전류로 나눈 비율입니다. 같은 일을 하는 데 누가 힘을 덜 쓰는지 견주는 것과 같아요. 단락비가 크면 전압 변동이 작고 안정적인 둔감한 발전기입니다.", source:[56] },
  { id:"s3-58", subject:3, term:"건조법 (변압기 건조법)", difficulty:2, def:"변압기 내부에 스며든 습기를 없애 절연 성능을 되살리는 여러 방법을 통틀어 부르는 말입니다. 젖은 빨래를 햇볕·바람·열로 말리는 것처럼 다양한 방식이 있어요. 열풍법, 단락법, 진공법 등이 대표적인 건조법입니다.", source:[57] },
  { id:"s3-59", subject:3, term:"열풍법", difficulty:2, def:"변압기에 뜨거운 바람을 불어넣어 내부 습기를 증발시켜 말리는 건조법입니다. 헤어드라이어로 젖은 머리를 말리는 것과 똑같은 원리예요. 간단하고 흔히 쓰이는 변압기 건조 방법입니다.", source:[57] },
  { id:"s3-60", subject:3, term:"단락법 (건조법)", difficulty:3, def:"변압기 2차측을 단락한 채 1차에 전압을 걸어 권선에 전류를 흘려, 그때 생기는 열로 내부 습기를 말리는 건조법입니다. 운동으로 몸을 데워 땀과 습기를 날리는 것과 비슷해요. 변압기 스스로 열을 내 건조하는 방식입니다.", source:[57] },
  { id:"s3-61", subject:3, term:"진공법 (건조법)", difficulty:3, def:"변압기를 진공 용기에 넣어 기압을 낮추면 물이 낮은 온도에서도 쉽게 증발하는 성질을 이용해 습기를 빼는 건조법입니다. 높은 산에서 물이 100도보다 낮게 끓는 것과 같은 원리예요. 깊숙한 습기까지 효과적으로 제거합니다.", source:[57] },
  { id:"s3-62", subject:3, term:"권선계수", difficulty:3, def:"동기발전기 권선이 분포·단절되어 있어 유도 전압이 이상적인 값보다 줄어드는 정도를 나타낸 1보다 작은 보정 계수입니다. 합창단이 한목소리로 안 맞춰 전체 소리가 조금 작아지는 것과 같아요. 분포계수와 단절권계수를 곱해 구합니다.", source:[58] },
  { id:"s3-63", subject:3, term:"코일피치 (단절권)", difficulty:3, def:"전기자 코일의 두 변이 자극 한 칸 간격(자극피치)보다 좁게 벌어지도록 감는 것을 말합니다. 보폭을 한 칸보다 조금 짧게 떼어 걷는 것과 같아요. 이렇게 단절권으로 감으면 고조파가 줄어 파형이 깨끗해집니다.", source:[58] },
  { id:"s3-64", subject:3, term:"유효자속 (기본파 자속)", difficulty:3, def:"동기발전기에서 전압을 유도하는 데 실제로 쓰이는 기본파 성분의 자속입니다. 여러 음이 섞인 소리에서 가장 중요한 기준 음만 골라낸 것과 같아요. 이 자속의 크기로 발전기가 만드는 유도 전압이 정해집니다. 단위는 웨버(Wb).", source:[58] },
  { id:"s3-65", subject:3, term:"사이리스터 (thyristor)", difficulty:2, def:"게이트 신호로 켜고 끌 수 있는, 전류를 한 방향 또는 양방향으로 흘리는 반도체 스위치 부품을 통틀어 부르는 말입니다. 사람이 신호를 줘야 열리는 자동문 같은 소자예요. SCR, TRIAC, SSS, SCS 등이 모두 이 무리에 속합니다.", source:[59] },
  { id:"s3-66", subject:3, term:"TRIAC (트라이악)", difficulty:3, def:"양쪽 방향 모두로 전류를 흘릴 수 있는 2방향성 3단자 사이리스터입니다. SCR 두 개를 등 맞대 붙여 놓은 셈으로, 교류의 양쪽 반파를 모두 제어할 수 있어요. 전등 밝기 조절기나 모터 속도 조절에 자주 쓰입니다.", source:[59] },
  { id:"s3-67", subject:3, term:"SSS (실리콘 대칭 스위치)", difficulty:3, def:"게이트 단자 없이 양쪽 방향으로 전류를 흘릴 수 있는 2방향성 2단자 사이리스터입니다. 일정 전압을 넘으면 저절로 켜지는 자동 빗장 같은 소자예요. 구조가 단순해 조광기 같은 간단한 교류 제어에 쓰입니다.", source:[59] },
  { id:"s3-68", subject:3, term:"SCS (실리콘 제어 스위치)", difficulty:3, def:"게이트 단자가 두 개여서 켜고 끄는 것을 모두 조절할 수 있는 단방향성 4단자 사이리스터입니다. 켜는 손잡이와 끄는 손잡이가 따로 달린 스위치 같아요. SCR보다 제어가 세밀해 정밀한 스위칭 회로에 쓰입니다.", source:[59] },
  { id:"s3-69", subject:3, term:"농형 유도전동기", difficulty:2, def:"회전자에 굵은 도체 막대를 다람쥐 쳇바퀴(농형) 모양으로 끼워 만든 유도전동기입니다. 통째로 짜인 새장처럼 구조가 단순하고 튼튼해요. 권선형보다 고장이 적고 값이 싸 가장 널리 쓰이는 전동기입니다.", source:[60] },
  { id:"s3-70", subject:3, term:"권선형 유도전동기", difficulty:2, def:"회전자에도 코일을 감고 그 끝을 슬립링을 통해 바깥으로 빼낸 유도전동기입니다. 바깥에서 저항을 더 연결할 수 있는 손잡이가 달린 셈이에요. 기동 토크를 크게 하거나 속도를 조절하기 좋지만 구조가 복잡합니다.", source:[49,60] },
  { id:"s3-71", subject:3, term:"원선도", difficulty:3, def:"유도전동기의 전류·역률·토크 같은 특성을 원 모양 그래프 하나로 한눈에 보여주는 그림입니다. 시험 결과를 지도처럼 펼쳐 놓아 운전 상태를 짚어볼 수 있어요. 무부하시험, 구속시험, 1차 권선저항 측정 자료로 그립니다.", source:[60] },
  { id:"s3-72", subject:3, term:"구속시험", difficulty:3, def:"유도전동기의 회전자를 못 돌게 묶어 놓고 전압을 걸어 전류와 손실을 재는 시험입니다. 달리기 선수를 출발선에 붙들어 놓고 힘을 측정하는 것과 같아요. 원선도를 그리는 데 필요한 단락 특성 자료를 얻습니다.", source:[60] },
  { id:"s3-73", subject:3, term:"무부하시험", difficulty:2, def:"유도전동기에 부하를 달지 않고 정격전압을 걸어, 이때 흐르는 전류와 손실을 재는 시험입니다. 빈 손수레를 그냥 굴려보며 마찰을 가늠하는 것과 같아요. 철손과 여자전류를 알아내 원선도 작성에 씁니다.", source:[60] },
  { id:"s3-74", subject:3, term:"게르게스현상", difficulty:3, def:"권선형 유도전동기 회전자 3선 중 한 가닥이 끊어지면, 동기속도의 약 50% 지점에서 회전이 더 이상 빨라지지 않고 멈춰 버리는 현상입니다. 자전거 페달 한쪽이 헛돌아 어느 속도 이상 못 올리는 것과 비슷해요. 결상 고장을 알리는 신호입니다.", source:[60] },
  { id:"s3-75", subject:3, term:"불평형 전압", difficulty:2, def:"3상 전원의 세 상 전압 크기나 위상이 서로 고르지 않게 어긋난 상태입니다. 세 사람이 짐을 들 때 한 명만 힘을 덜 쓰는 것과 같아요. 이러면 전동기 전류는 늘지만 토크는 줄고 발열이 심해집니다.", source:[60] },
  { id:"s4-01", subject:4, term:"블록선도", difficulty:1, def:"제어 시스템의 신호가 어떻게 흘러가고 어떤 처리를 거치는지 네모 상자와 화살표로 그린 그림입니다. 마치 공장의 생산 라인을 도식으로 그려 원료가 어느 기계를 거쳐 제품이 되는지 보여주는 것과 같아요. 각 네모는 입력을 출력으로 바꾸는 처리 과정을 뜻합니다.", source:[61] },
  { id:"s4-02", subject:4, term:"전달함수 C(s)/R(s)", difficulty:2, def:"시스템에 어떤 입력 R을 넣으면 출력 C가 얼마로 나오는지 그 비율을 s 영역(라플라스 변환)으로 표현한 식입니다. 마치 자판기에 동전을 넣으면 음료가 나오는 규칙처럼, 입력 대비 출력의 관계를 하나의 수식으로 압축한 것이에요. 시스템의 성질을 한눈에 보여주는 신분증 같은 역할을 합니다.", source:[61,62,66] },
  { id:"s4-03", subject:4, term:"피드백 (되먹임)", difficulty:2, def:"출력의 일부를 다시 입력 쪽으로 되돌려 보내 시스템이 스스로 자기 결과를 보고 조정하게 하는 구조입니다. 마치 샤워할 때 물이 너무 뜨거우면 손으로 느끼고 수도꼭지를 다시 돌리는 것처럼, 결과를 확인해 입력을 고치는 과정이에요. 이 덕분에 시스템이 목표값을 정확히 따라갈 수 있습니다.", source:[61] },
  { id:"s4-04", subject:4, term:"이득 (게인)", difficulty:1, def:"입력 신호가 시스템을 거치면서 몇 배로 커지거나 작아지는지를 나타내는 값입니다. 마치 확성기가 작은 목소리를 큰 소리로 키우는 배율과 같아요. 1보다 크면 신호가 증폭되고, 1보다 작으면 줄어듭니다.", source:[61,62] },
  { id:"s4-05", subject:4, term:"데시벨 이득 (dB)", difficulty:2, def:"이득(배율)을 로그를 써서 데시벨이라는 단위로 바꾼 값으로, 20log(배율)로 계산합니다. 마치 아주 큰 숫자와 아주 작은 숫자를 같은 자 위에 놓기 위해 눈금을 압축한 것과 같아요. 10배는 20dB, 100배는 40dB가 되어 넓은 범위를 다루기 편합니다. 단위는 dB.", source:[62] },
  { id:"s4-06", subject:4, term:"위상각", difficulty:2, def:"입력 신호의 출렁임에 비해 출력 신호의 출렁임이 시간적으로 얼마나 앞서거나 뒤처지는지를 각도로 나타낸 값입니다. 마치 두 사람이 같은 박자로 손뼉을 치지만 한 명이 조금 늦게 치는 그 시간 차이를 각도로 표현한 것이에요. 단위는 도(°).", source:[62] },
  { id:"s4-07", subject:4, term:"주파수 응답", difficulty:3, def:"시스템에 여러 빠르기(주파수)의 흔들리는 입력을 넣었을 때 출력의 크기와 위상이 어떻게 달라지는지를 보는 분석입니다. 마치 오디오 스피커가 저음과 고음을 각각 얼마나 잘 내는지 시험해 보는 것과 같아요. 주파수 ω가 바뀔 때 이득과 위상이 변하는 모습을 살펴봅니다.", source:[62] },
  { id:"s4-08", subject:4, term:"각주파수 ω", difficulty:2, def:"신호가 1초 동안 얼마나 빠르게 진동하는지를 라디안 단위로 나타낸 값으로, 보통 주파수에 2π를 곱한 값입니다. 마치 회전목마가 1초에 몇 라디안만큼 도는지를 재는 것과 같아요. 값이 클수록 신호가 더 빠르게 출렁입니다. 단위는 rad/s.", source:[62] },
  { id:"s4-09", subject:4, term:"논리식", difficulty:1, def:"참(1)과 거짓(0) 두 가지 값만 다루는 변수들을 AND, OR, NOT 같은 연산으로 묶어 디지털 회로의 동작을 적은 식입니다. 마치 비가 오고 또 우산이 없으면 젖는다처럼 조건을 논리로 표현한 문장과 같아요. 디지털 회로 설계의 기본 언어입니다.", source:[63] },
  { id:"s4-10", subject:4, term:"불 대수 (논리 대수)", difficulty:2, def:"참과 거짓만 다루는 논리식을 마치 보통 수학처럼 더하고 곱하고 간단히 정리할 수 있게 만든 규칙 체계입니다. 마치 복잡한 분수식을 약분해 간단하게 만들듯, 복잡한 논리식을 줄여 더 단순한 회로로 만들 수 있어요. (A+B)(Ā+B) 같은 식을 Y=B로 줄이는 것이 그 예입니다.", source:[63] },
  { id:"s4-11", subject:4, term:"보수 Ā (NOT, 부정)", difficulty:1, def:"어떤 논리값을 정반대로 뒤집는 연산으로, 1은 0으로 0은 1로 바뀝니다. 마치 전등 스위치를 한 번 눌러 켜짐과 꺼짐을 반대로 바꾸는 것과 같아요. 기호 위에 가로줄을 그어 Ā처럼 표시합니다.", source:[63] },
  { id:"s4-12", subject:4, term:"개루프 전달함수 G(s)H(s)", difficulty:3, def:"피드백 고리를 한 바퀴 따라갔을 때 신호가 받는 전체 영향을 나타낸 식으로, 앞쪽 경로 G와 되돌아오는 경로 H를 곱한 것입니다. 마치 순환 버스 노선을 한 바퀴 완주했을 때 거리와 시간이 얼마나 되는지 따져 보는 것과 같아요. 시스템이 안정한지 판단하는 핵심 재료입니다.", source:[64] },
  { id:"s4-13", subject:4, term:"근궤적", difficulty:3, def:"제어기의 이득 K를 0부터 무한대까지 키울 때, 시스템의 극(특성근)들이 복소평면 위에서 그리며 이동하는 자취입니다. 마치 손잡이를 천천히 돌리면 화면 속 점들이 미끄러지듯 움직이는 궤적을 보는 것과 같아요. 이 자취로 어떤 K에서 시스템이 불안정해지는지 알 수 있습니다.", source:[64] },
  { id:"s4-14", subject:4, term:"분리점 (이탈점)", difficulty:3, def:"근궤적이 실수축 위를 따라가다가 더 이상 실수축에 머물지 못하고 복소평면 위아래로 갈라져 나가는 지점입니다. 마치 한 줄로 가던 길이 갑자기 두 갈래로 나뉘는 분기점과 같아요. 이 점을 넘으면 시스템의 응답이 진동하는 성질로 바뀝니다.", source:[64] },
  { id:"s4-15", subject:4, term:"실수축", difficulty:2, def:"복소평면에서 허수 부분이 0인, 보통의 실수만 놓이는 가로축입니다. 마치 좌표평면의 x축처럼 복소수 그래프의 기준이 되는 가로선이에요. 극이나 영점이 이 축 위에 있으면 진동 없는 응답과 관련됩니다.", source:[64] },
  { id:"s4-16", subject:4, term:"역 z 변환", difficulty:3, def:"디지털 신호를 다루기 쉽게 바꿔 놓은 z 영역의 식을, 다시 시간에 따라 변하는 원래 신호로 되돌리는 계산입니다. 마치 외국어로 번역된 문장을 다시 원래 우리말로 옮기는 것과 같아요. 컴퓨터가 띄엄띄엄 처리하는 이산 신호 분석에 쓰입니다.", source:[65] },
  { id:"s4-17", subject:4, term:"z 변환", difficulty:3, def:"일정 시간 간격으로 띄엄띄엄 측정한 디지털 신호(이산 신호)를 z라는 변수의 식으로 바꿔 다루기 쉽게 만드는 수학 도구입니다. 마치 연속된 영상을 한 장 한 장 사진으로 찍어 모아 분석하는 것과 같아요. 디지털 제어 시스템 해석의 기본 언어입니다.", source:[65] },
  { id:"s4-18", subject:4, term:"샘플링 주기 T", difficulty:2, def:"디지털 시스템이 연속 신호를 일정한 시간 간격마다 한 번씩 측정할 때, 그 한 번과 다음 한 번 사이의 시간 간격입니다. 마치 카메라가 몇 초마다 한 장씩 사진을 찍는 그 촬영 간격과 같아요. 이 간격이 짧을수록 원래 신호를 더 촘촘하게 담아냅니다. 단위는 초(s).", source:[65] },
  { id:"s4-19", subject:4, term:"비례요소", difficulty:2, def:"입력이 들어오면 그 값에 일정한 상수 K를 곱한 만큼만 즉시 출력하는 가장 단순한 제어 요소입니다. 마치 환율처럼 1달러를 넣으면 정해진 배수만큼 원화가 바로 나오는 것과 같아요. 전달함수가 G(s)=K로 시간 지연 없이 동작합니다.", source:[66] },
  { id:"s4-20", subject:4, term:"기본 제어요소", difficulty:2, def:"비례, 미분, 적분, 1차 지연처럼 제어 시스템을 이루는 가장 작은 기본 단위 동작들을 말합니다. 마치 레고 블록 한 개 한 개가 모여 큰 모형을 이루듯, 이 기본 요소들을 조합해 복잡한 제어기를 만들어요. 각각 고유한 전달함수 모양을 가집니다.", source:[66] },
  { id:"s4-21", subject:4, term:"상태방정식", difficulty:3, def:"시스템의 현재 상태(변수들)가 시간에 따라 어떻게 변하는지를 행렬을 이용한 1차 미분방정식으로 적은 식입니다. 마치 게임 캐릭터의 체력과 위치가 매 순간 어떻게 바뀌는지 규칙으로 정리한 것과 같아요. 여러 변수를 가진 복잡한 시스템을 깔끔하게 다룰 수 있습니다.", source:[67] },
  { id:"s4-22", subject:4, term:"상태변수", difficulty:3, def:"시스템의 현재 상태를 완전히 설명하기 위해 필요한 최소한의 변수들로, 보통 x1, x2처럼 표시합니다. 마치 자동차의 현재 상태를 알려면 위치와 속도만 알면 되듯, 시스템을 파악하는 데 꼭 필요한 핵심 정보예요. 이 값들을 알면 미래 동작을 예측할 수 있습니다.", source:[67] },
  { id:"s4-23", subject:4, term:"상태천이행렬", difficulty:3, def:"입력이 없을 때 시스템의 상태가 시간이 지나면서 처음 상태에서 나중 상태로 어떻게 옮겨가는지를 알려주는 행렬입니다. 마치 일기예보가 오늘 날씨로부터 내일 날씨를 알려주는 변환표와 같아요. 행렬 지수함수 e^(At)로 구하며, 시스템의 자연스러운 시간 변화를 담고 있습니다.", source:[67] },
  { id:"s4-24", subject:4, term:"행렬 지수함수 e^(At)", difficulty:3, def:"보통의 지수함수 e^(at)를 행렬 A에 대해 확장한 것으로, 상태천이행렬을 구하는 데 쓰입니다. 마치 한 개의 숫자가 시간에 따라 불어나는 규칙을 여러 변수가 얽힌 시스템 전체로 넓혀 적용한 것과 같아요. 시간에 따른 상태 변화를 한 번에 계산해 줍니다.", source:[67] },
  { id:"s4-25", subject:4, term:"고유주파수 ωₙ", difficulty:2, def:"시스템을 한 번 건드렸을 때 외부 힘 없이 스스로 진동하려는 고유한 빠르기입니다. 마치 그네를 한 번 밀면 그네 길이에 따라 정해진 박자로 흔들리는 것과 같아요. 시스템마다 정해진 값이며 응답의 빠르기를 좌우합니다. 단위는 rad/s.", source:[68] },
  { id:"s4-26", subject:4, term:"감쇠율 ζ (제타)", difficulty:3, def:"시스템이 진동할 때 그 흔들림이 얼마나 빨리 잦아드는지를 나타내는 값입니다. 마치 그네에서 손을 떼면 공기 저항 때문에 흔들림이 점점 줄어드는 정도와 같아요. 값이 0이면 계속 진동하고, 1 이상이면 진동 없이 가라앉으며, 0과 1 사이면 출렁이다 멈춥니다.", source:[68] },
  { id:"s4-27", subject:4, term:"2차 시스템", difficulty:3, def:"전달함수의 분모가 s의 2차식인 시스템으로, 고유주파수와 감쇠율 두 값으로 동작이 결정됩니다. 마치 용수철에 매달린 추가 무게와 마찰에 따라 다르게 흔들리는 것처럼 두 성질이 응답을 좌우해요. 제어공학에서 가장 자주 분석하는 표준 모형입니다.", source:[68] },
  { id:"s4-28", subject:4, term:"신호흐름선도 (신호흐름도)", difficulty:3, def:"시스템의 신호를 점(노드)과 화살표(가지)로 그려, 각 신호가 어떤 이득을 거쳐 어디로 흐르는지 보여주는 그림입니다. 마치 지하철 노선도가 역과 연결선으로 이동 경로를 나타내는 것과 같아요. 블록선도와 같은 정보를 더 간결한 점·선 형태로 표현합니다.", source:[69] },
  { id:"s4-29", subject:4, term:"미분방정식", difficulty:2, def:"어떤 양과 그 양이 변하는 빠르기(미분) 사이의 관계를 적은 식으로, 시스템이 시간에 따라 어떻게 움직이는지를 나타냅니다. 마치 속도는 위치가 변하는 빠르기라는 관계를 수식으로 적은 것과 같아요. 물리 시스템의 동작을 묘사하는 기본 도구입니다.", source:[69] },
  { id:"s4-30", subject:4, term:"초기값", difficulty:1, def:"시스템을 분석하기 시작하는 시점(보통 t=0)에서 변수들이 가지고 있던 처음 값입니다. 마치 달리기 경주에서 출발선의 위치와 같아요. 0으로 두면 시스템이 가만히 멈춰 있던 상태에서 출발한다는 뜻입니다.", source:[69] },
  { id:"s4-31", subject:4, term:"특성방정식", difficulty:3, def:"전달함수의 분모를 0으로 놓아 만든 방정식으로, 시스템의 안정성과 응답 성질을 결정합니다. 마치 건물의 골격이 건물 전체의 튼튼함을 정하듯, 이 방정식의 해가 시스템의 운명을 좌우해요. 이 식의 근 위치를 보면 시스템이 안정한지 알 수 있습니다.", source:[70] },
  { id:"s4-32", subject:4, term:"s 평면", difficulty:2, def:"라플라스 변환의 변수 s를 가로축(실수부)과 세로축(허수부)으로 펼쳐 그린 복소평면입니다. 마치 지도 위에 점을 찍어 위치를 표시하듯, 시스템의 극을 이 평면에 찍어 성질을 봅니다. 극이 왼쪽에 있으면 안정, 오른쪽에 있으면 불안정합니다.", source:[70] },
  { id:"s4-33", subject:4, term:"s 평면 우반평면의 근", difficulty:3, def:"특성방정식의 근이 s 평면의 오른쪽(실수부가 양수인 영역)에 놓인 경우를 말하며, 이런 근이 하나라도 있으면 시스템은 불안정합니다. 마치 의자의 무게중심이 받침 밖으로 넘어가면 쓰러지는 것과 같아요. 시스템 응답이 시간이 갈수록 점점 커져 발산하게 됩니다.", source:[70] },
  { id:"s4-34", subject:4, term:"라우스 안정도 판별법", difficulty:3, def:"특성방정식의 계수만 표로 늘어놓아 계산하면, 방정식을 직접 풀지 않고도 불안정한 근이 몇 개인지 알 수 있는 방법입니다. 마치 영수증의 숫자만 보고 계산이 맞는지 빠르게 점검하는 것과 같아요. 표 첫 열의 부호가 바뀐 횟수가 곧 우반평면 근의 개수입니다.", source:[70] },
  { id:"s4-35", subject:4, term:"시스템 안정도", difficulty:2, def:"외부에서 작은 자극을 주었을 때 시스템의 출력이 발산하지 않고 적당한 값으로 가라앉는 성질입니다. 마치 바닥에 놓인 그릇 안의 구슬이 흔들어도 다시 가운데로 모이는 것과 같아요. 안정해야 제어 시스템을 실제로 쓸 수 있습니다.", source:[70] },
  { id:"s4-36", subject:4, term:"전류원", difficulty:2, def:"연결된 회로가 어떻게 바뀌든 항상 정해진 크기의 전류를 흘려보내는 이상적인 전원입니다. 마치 수도 계량기를 통해 무조건 일정한 양의 물을 내보내는 펌프와 같아요. 전압원이 전압을 고정하는 것과 달리, 전류원은 전류를 고정합니다. 단위는 암페어(A).", source:[71] },
  { id:"s4-37", subject:4, term:"중첩의 원리", difficulty:3, def:"전원이 여러 개인 회로에서, 전원을 하나씩만 켜고 나머지는 끈 채 각각 구한 결과를 모두 더하면 전체 결과가 된다는 원리입니다. 마치 여러 사람이 함께 민 수레의 이동량을, 한 사람씩 민 거리를 더해 구하는 것과 같아요. 복잡한 회로를 쉬운 여러 회로로 나눠 풀 수 있게 해 줍니다.", source:[71] },
  { id:"s4-38", subject:4, term:"시정수 (시상수) τ", difficulty:2, def:"RL이나 RC 회로에서 전류나 전압이 최종값의 약 63%까지 변하는 데 걸리는 시간으로, 변화의 빠르기를 나타냅니다. 마치 뜨거운 커피가 식는 속도를 하나의 시간 값으로 요약한 것과 같아요. 값이 클수록 회로가 천천히 반응합니다. 단위는 초(s).", source:[72] },
  { id:"s4-39", subject:4, term:"RL 직렬회로", difficulty:2, def:"저항(R)과 코일(인덕터 L)을 한 줄로 이어 붙인 회로입니다. 마치 좁은 관(저항)과 무거운 회전문(코일)을 차례로 지나는 물길과 같아요. 코일 때문에 전류가 갑자기 변하지 못하고 시정수에 따라 서서히 오르거나 내려갑니다.", source:[72] },
  { id:"s4-40", subject:4, term:"인덕턴스 L", difficulty:2, def:"코일이 전류 변화에 얼마나 강하게 저항하며 자기 에너지를 저장하는지를 나타내는 값입니다. 마치 무거운 회전문이 갑자기 돌거나 멈추기 어려운 것처럼, 인덕턴스가 큰 코일은 전류를 급히 바꾸기 어려워요. 단위는 헨리(H), 작은 값은 밀리헨리(mH)로 씁니다.", source:[72] },
  { id:"s4-41", subject:4, term:"불평형 3상 회로", difficulty:2, def:"세 가닥의 전류나 전압의 크기가 서로 다르거나 위상 간격이 120도에서 어긋난 3상 회로입니다. 마치 세 명이 같은 박자, 같은 힘으로 노를 저어야 하는데 한두 명이 어긋나게 젓는 상태와 같아요. 고장이나 부하 치우침으로 생기며 대칭좌표법으로 분석합니다.", source:[73] },
  { id:"s4-42", subject:4, term:"대칭좌표법", difficulty:3, def:"복잡한 불평형 3상 전류·전압을 정상분·역상분·영상분이라는 세 가지 균형 잡힌 성분으로 쪼개어 분석하는 방법입니다. 마치 뒤섞인 색 빛을 프리즘으로 빨강·초록·파랑으로 나눠 다루는 것과 같아요. 나눠서 풀면 어려운 불평형 문제가 훨씬 쉬워집니다.", source:[73] },
  { id:"s4-43", subject:4, term:"역상분 전류", difficulty:3, def:"대칭좌표법에서 정상과 반대 순서로 회전하는 불평형 성분으로, 회로가 불평형일 때만 나타납니다. 마치 모두 시계 방향으로 도는 회전목마 속에 거꾸로 도는 말이 섞여 있는 것과 같아요. 전동기에서는 역상분이 제동 토크를 만들어 과열을 일으킬 수 있습니다. 단위는 암페어(A).", source:[73] },
  { id:"s4-44", subject:4, term:"정상분 전류", difficulty:3, def:"대칭좌표법에서 원래의 정상적인 순서(a-b-c)대로 회전하는 균형 잡힌 성분입니다. 마치 회전목마의 말들이 모두 같은 방향으로 가지런히 도는 모습과 같아요. 평형 상태일 때는 이 성분만 존재하며, 전동기를 정상적으로 돌리는 힘이 됩니다.", source:[73] },
  { id:"s4-45", subject:4, term:"영상분 전류", difficulty:3, def:"대칭좌표법에서 세 상이 회전 없이 크기와 위상이 똑같이 함께 움직이는 성분입니다. 마치 세 사람이 동시에 같은 발을 같은 방향으로 내딛는 것과 같아요. 주로 지락(땅과의 누전) 고장 때 나타나 접지 보호 계전기를 동작시킵니다. 단위는 암페어(A).", source:[73] },
  { id:"s4-46", subject:4, term:"페이저 표기 (∠ 극형식)", difficulty:2, def:"흔들리는 교류 신호를 크기와 위상각 한 쌍으로 간단히 적는 방법으로, 7.28∠15.95°처럼 씁니다. 마치 시곗바늘의 길이와 가리키는 방향만으로 위치를 나타내는 것과 같아요. 복잡한 교류 계산을 보통의 곱셈·나눗셈처럼 다룰 수 있게 해 줍니다.", source:[73,75] },
  { id:"s4-47", subject:4, term:"상순 (상의 순서)", difficulty:2, def:"3상 교류에서 a, b, c 세 상의 전압이 시간상 어느 순서로 최댓값에 도달하는지를 나타낸 차례입니다. 마치 육상 계주에서 1번, 2번, 3번 주자가 바통을 받는 순서와 같아요. 이 순서가 전동기의 회전 방향을 결정합니다.", source:[73] },
  { id:"s4-48", subject:4, term:"T형 4단자 회로", difficulty:2, def:"입력 두 단자와 출력 두 단자를 가진 회로에서 내부 소자가 알파벳 T 모양으로 배치된 회로입니다. 마치 입구와 출구가 있는 상자 속을 들여다보지 않고 입출력 관계만 다루는 것과 같아요. 두 임피던스는 양옆에, 하나는 가운데에 놓여 T자를 이룹니다.", source:[74] },
  { id:"s4-49", subject:4, term:"임피던스 파라미터 Z", difficulty:3, def:"4단자 회로의 입출력 전압과 전류 관계를 임피던스 형태의 네 가지 값(Z11, Z12, Z21, Z22)으로 정리한 것입니다. 마치 상자에 들어가는 힘과 나오는 힘의 관계를 네 개의 숫자로 요약한 설명서와 같아요. 회로 속을 몰라도 외부 동작을 예측할 수 있습니다.", source:[74] },
  { id:"s4-50", subject:4, term:"개방회로 임피던스 Z₂₂", difficulty:3, def:"4단자 회로에서 입력 쪽을 열어 둔(전류가 안 흐르는) 상태로 출력 단자에서 본 임피던스입니다. 마치 한쪽 문을 닫아 두고 다른 쪽에서만 방의 깊이를 재 보는 것과 같아요. T형 회로에서는 출력 쪽 직렬 임피던스와 가운데 임피던스의 합이 됩니다. 단위는 옴(Ω).", source:[74] },
  { id:"s4-51", subject:4, term:"선간전압", difficulty:1, def:"3상 회로에서 세 가닥의 전선 중 두 가닥 사이에서 측정한 전압입니다. 마치 세 개의 기둥 사이를 두 개씩 짝지어 거리를 재는 것과 같아요. 한 상과 중성점 사이의 상전압보다 √3배 크다는 관계가 있습니다. 단위는 볼트(V).", source:[75] },
  { id:"s4-52", subject:4, term:"선전류", difficulty:1, def:"3상 회로에서 전원과 부하를 잇는 각 전선에 실제로 흐르는 전류입니다. 마치 건물로 들어가는 수도관 각각에 흐르는 물의 양과 같아요. 부하가 Y결선이냐 △결선이냐에 따라 상전류와의 관계가 달라집니다. 단위는 암페어(A).", source:[75] },
  { id:"s4-53", subject:4, term:"평형 3상 전압", difficulty:2, def:"세 상의 전압 크기가 모두 같고 서로 정확히 120도씩 위상 간격을 두고 있는 이상적인 3상 전압입니다. 마치 세 사람이 같은 힘으로 똑같은 간격을 두고 노를 젓는 상태와 같아요. 전력을 끊김 없이 고르게 전달할 수 있어 산업용 전력의 기본입니다.", source:[75] },
  { id:"s4-54", subject:4, term:"△ 결선 (델타 결선)", difficulty:2, def:"3상 회로에서 세 소자를 머리와 꼬리를 이어 삼각형 모양으로 연결한 방식입니다. 마치 세 사람이 손을 잡고 둥글게 삼각형을 이루는 것과 같아요. 이 결선에서는 선간전압과 상전압이 같습니다.", source:[75,77] },
  { id:"s4-55", subject:4, term:"용량성 리액턴스", difficulty:2, def:"커패시터가 교류 전류의 흐름을 방해하는 정도로, 주파수가 높을수록 작아집니다. 마치 출렁임이 빠를수록 더 쉽게 통과시키는 회전문과 같아요. 회로식에서 jωC 형태로 나타나며, 전류가 전압보다 위상이 앞섭니다.", source:[75] },
  { id:"s4-56", subject:4, term:"분포정수회로", difficulty:3, def:"송전선처럼 아주 긴 선로에서 저항·인덕턴스·커패시턴스가 한곳에 뭉친 게 아니라 선 전체에 골고루 퍼져 있다고 보고 분석하는 회로입니다. 마치 긴 호스의 굵기와 마찰을 한 점이 아니라 호스 전체에 분산된 것으로 다루는 것과 같아요. 신호가 선을 따라 파동처럼 전달됩니다.", source:[76] },
  { id:"s4-57", subject:4, term:"무왜형 조건 (무왜곡 조건)", difficulty:3, def:"선로를 통과한 신호가 모양이 일그러지지 않고 원래 파형 그대로 전달되도록 하는 조건으로, RC = LG 관계를 만족할 때 성립합니다. 마치 골짜기를 지나도 메아리가 찌그러지지 않고 원래 목소리 그대로 들리는 것과 같아요. 통신 선로에서 신호 왜곡을 막는 핵심 조건입니다.", source:[76] },
  { id:"s4-58", subject:4, term:"컨덕턴스 G", difficulty:2, def:"전류가 얼마나 잘 흐르는지를 나타내는 값으로, 저항의 반대 개념(저항의 역수)입니다. 마치 문이 얼마나 좁은지(저항) 대신 얼마나 활짝 열려 있는지를 재는 것과 같아요. 선로에서는 절연체를 통한 누설 정도를 뜻하며, 단위는 지멘스(S).", source:[76] },
  { id:"s4-59", subject:4, term:"분포정수 (단위 길이당 정수)", difficulty:3, def:"긴 선로의 성질을 1km 또는 1m 같은 단위 길이마다의 저항·인덕턴스·커패시턴스·컨덕턴스 값으로 나타낸 것입니다. 마치 도로의 상태를 1km 구간마다의 평균 거칠기로 적어 두는 것과 같아요. 이 값들로 선로 전체의 신호 전달을 계산합니다.", source:[76] },
  { id:"s4-60", subject:4, term:"Y 결선 (성형 결선)", difficulty:2, def:"3상 회로에서 세 소자의 한쪽 끝을 모두 한 점(중성점)에 모아 별 모양으로 연결한 방식입니다. 마치 세 사람이 가운데 한 점에서 손을 모으고 별처럼 뻗어 있는 모습과 같아요. 이 결선에서는 선간전압이 상전압의 √3배가 됩니다.", source:[77] },
  { id:"s4-61", subject:4, term:"Y-△ 변환 (성형-델타 변환)", difficulty:3, def:"별 모양(Y)으로 연결된 세 저항을 외부에서 보기에 똑같이 동작하는 삼각형(△) 연결로, 또는 그 반대로 바꿔 계산하는 방법입니다. 마치 같은 길을 가는 두 가지 다른 도로 배치를 서로 갈아 끼우는 것과 같아요. 복잡한 회로를 풀기 쉬운 형태로 바꿀 때 씁니다.", source:[77] },
  { id:"s4-62", subject:4, term:"등가 변환", difficulty:2, def:"회로의 일부를 외부에서 보기에 똑같이 동작하는 다른 모양의 회로로 바꾸는 것입니다. 마치 똑같은 무게의 짐을 더 옮기기 쉬운 모양의 상자로 다시 포장하는 것과 같아요. 바꿔도 회로 바깥의 전압·전류는 변하지 않아 계산이 편해집니다.", source:[77] },
  { id:"s4-63", subject:4, term:"비정현파 (비정현파 교류)", difficulty:2, def:"깨끗한 사인파 한 개가 아니라, 여러 주파수의 사인파가 겹쳐 만들어진 일그러진 모양의 교류입니다. 마치 여러 악기 소리가 합쳐져 하나의 복잡한 화음이 되는 것과 같아요. 기본파와 여러 고조파의 합으로 분석합니다.", source:[78] },
  { id:"s4-64", subject:4, term:"고조파", difficulty:3, def:"비정현파에 섞여 있는, 기본 주파수의 정수 배(2배, 3배 등)인 성분들입니다. 마치 기본 음에 얹혀 음색을 만드는 배음과 같아요. 100πt가 기본파라면 300πt는 3고조파이며, 전력 품질을 떨어뜨리는 원인이 됩니다.", source:[78] },
  { id:"s4-65", subject:4, term:"평균전력 (유효전력)", difficulty:2, def:"교류 회로에서 한 주기 동안 실제로 부하가 소비해 일로 바뀌는 전력의 평균값입니다. 마치 들쭉날쭉한 한 달 용돈 지출을 평균 내어 하루치로 본 것과 같아요. 비정현파에서는 같은 주파수끼리 짝지어 더해 구하며, 단위는 와트(W).", source:[78] },
  { id:"s4-66", subject:4, term:"복소전력", difficulty:3, def:"교류 회로의 전력을 실수 부분(유효전력)과 허수 부분(무효전력)을 함께 묶어 하나의 복소수로 표현한 것입니다. 마치 가계부에 실제 쓴 돈과 잠시 빌렸다 갚는 돈을 한 줄에 같이 적는 것과 같아요. 전압 페이저와 전류 페이저의 켤레를 곱해 구하며, 단위는 볼트암페어(VA).", source:[79] },
  { id:"s4-67", subject:4, term:"무효전력", difficulty:3, def:"복소전력의 허수 부분으로, 코일이나 커패시터가 에너지를 잠시 저장했다 되돌려보내기만 할 뿐 실제 일은 하지 않는 전력입니다. 마치 그네를 밀었다 당겼다 하지만 그네가 어디로도 가지 않는 것과 같아요. 일은 안 해도 전선에 부담을 주며, 단위는 바(Var).", source:[79] },
  { id:"s4-68", subject:4, term:"켤레 복소수 (공액 복소수)", difficulty:2, def:"복소수의 허수 부분 부호만 반대로 바꾼 짝꿍 복소수입니다. 마치 거울에 비친 상처럼 실수 부분은 그대로지만 위아래가 뒤집힌 모습이에요. 복소전력을 구할 때 전류 페이저의 켤레를 전압에 곱합니다.", source:[79] },
  { id:"s4-69", subject:4, term:"임피던스 Z", difficulty:2, def:"교류 회로에서 저항과 코일·커패시터의 방해 작용을 모두 합쳐 전류 흐름을 얼마나 막는지 나타낸 값입니다. 마치 좁은 통로와 무거운 문, 출렁이는 다리를 다 합친 전체 통행 어려움과 같아요. 크기와 위상을 함께 가지며 복소수로 표현하고, 단위는 옴(Ω).", source:[79] },
  { id:"s4-70", subject:4, term:"병렬 회로", difficulty:1, def:"여러 소자가 같은 두 지점 사이에 나란히 연결되어 전압을 똑같이 나눠 받는 회로입니다. 마치 강물이 여러 갈래 수로로 갈라져 동시에 흐르는 것과 같아요. 각 가지에 흐르는 전류를 모두 더하면 전체 전류가 됩니다.", source:[79] },
  { id:"s4-71", subject:4, term:"라플라스 역변환", difficulty:3, def:"s 영역으로 바꿔 풀어 놓은 식을 다시 시간에 따라 변하는 원래 함수로 되돌리는 계산입니다. 마치 압축 파일을 풀어 원래 문서로 되돌리는 것과 같아요. 미분방정식을 s 영역에서 쉽게 푼 뒤 마지막에 이 변환으로 답을 얻습니다.", source:[80] },
  { id:"s4-72", subject:4, term:"단위 임펄스 함수 δ(t)", difficulty:3, def:"아주 짧은 순간에만 무한히 큰 값을 갖고 그 면적은 1인, 톡 치는 듯한 신호입니다. 마치 망치로 종을 순간적으로 단 한 번 때리는 것과 같아요. 시스템의 반응을 시험하는 기준 입력으로 자주 쓰이며, 디랙 델타 함수라고도 합니다.", source:[80] },
  { id:"s4-73", subject:4, term:"감쇠 진동 응답", difficulty:3, def:"시간이 지날수록 진폭이 점점 작아지면서 출렁이는 시스템의 응답으로, 지수적으로 줄어드는 부분과 진동하는 부분이 곱해진 모양입니다. 마치 종을 친 뒤 소리가 떨리며 점점 잦아드는 것과 같아요. 극이 복소수일 때 나타나는 전형적인 응답입니다.", source:[80] },
  { id:"s4-74", subject:4, term:"극점과 영점", difficulty:3, def:"전달함수의 분모를 0으로 만드는 값이 극점, 분자를 0으로 만드는 값이 영점입니다. 마치 지도에서 산봉우리(극점)와 골짜기 바닥(영점)의 위치와 같아요. 극점은 시스템의 안정성과 응답 속도를, 영점은 응답 모양을 좌우합니다.", source:[64,80] },
  { id:"s5-01", subject:5, term:"피뢰설비", difficulty:2, def:"건물이나 설비에 벼락이 떨어졌을 때 그 강력한 전기를 안전하게 땅속으로 흘려보내 보호하는 장치 전체를 말합니다. 마치 비 오는 날 우산을 받쳐 머리가 젖지 않게 하듯, 피뢰설비는 벼락을 대신 맞아 시설물을 지켜줘요. 수뢰부, 인하도선, 접지극 등이 한 세트로 묶여 작동합니다.", source:[81] },
  { id:"s5-02", subject:5, term:"풍력터빈", difficulty:1, def:"바람의 힘으로 큰 날개를 돌려 그 회전력으로 전기를 만드는 발전 설비입니다. 마치 바람개비가 바람을 받아 빙글빙글 도는 것처럼, 풍력터빈도 바람을 받아 돌면서 발전기를 돌려요. 높은 곳에 세워지기 때문에 벼락을 맞기 쉬워 피뢰설비가 꼭 필요합니다.", source:[81] },
  { id:"s5-03", subject:5, term:"리셉터 (수뢰부)", difficulty:3, def:"벼락이 떨어질 때 그 벼락을 일부러 받아내도록 풍력터빈 날개 끝 등에 붙여 놓은 금속 받이입니다. 마치 야구에서 포수가 글러브로 공을 정확히 받아내듯, 리셉터는 벼락을 정해진 자리에서 받아 인하도선으로 넘겨줘요. 엉뚱한 곳에 벼락이 떨어져 설비가 타는 것을 막아줍니다.", source:[81] },
  { id:"s5-04", subject:5, term:"인하도선", difficulty:2, def:"수뢰부가 받아낸 벼락 전류를 위에서 아래 접지극까지 끌어내리는 굵은 금속선입니다. 마치 옥상에서 받은 빗물을 땅으로 내려보내는 빗물 홈통처럼, 인하도선은 벼락 전류가 지나가는 전용 통로 역할을 해요. 전류를 안전하게 흘릴 수 있도록 충분히 굵고, 가능한 한 직선으로 시설합니다.", source:[81] },
  { id:"s5-05", subject:5, term:"뇌격전류", difficulty:2, def:"벼락이 칠 때 순간적으로 흐르는 어마어마하게 큰 전류입니다. 마치 댐이 한꺼번에 터져 엄청난 물이 쏟아지듯, 뇌격전류는 짧은 시간에 수만 암페어가 흘러 닿는 것을 태워버릴 수 있어요. 그래서 피뢰설비는 이 전류를 견디고 안전하게 흘려보낼 수 있게 설계됩니다.", source:[81] },
  { id:"s5-06", subject:5, term:"뇌유도과전압", difficulty:3, def:"벼락이 직접 떨어지지 않아도, 근처에 친 벼락의 강한 전자기 영향으로 케이블 등에 갑자기 생기는 비정상적으로 높은 전압입니다. 마치 옆 사람이 크게 소리치면 직접 닿지 않아도 귀가 울리듯, 뇌유도과전압은 떨어진 거리에서도 전선에 충격을 줘요. 계측 센서 케이블은 금속관이나 차폐케이블로 이를 막습니다.", source:[81] },
  { id:"s5-07", subject:5, term:"차폐케이블", difficulty:2, def:"전선 둘레를 금속망이나 금속박으로 한 겹 감싸서 외부 전기 잡음이나 벼락의 영향이 안쪽 신호선으로 들어오지 못하게 막은 케이블입니다. 마치 시끄러운 거리에서 귀마개를 끼면 소음이 줄듯, 차폐층이 바깥 방해 전기를 막아줘요. 센서 신호처럼 약하고 예민한 전류를 보호할 때 씁니다.", source:[81] },
  { id:"s5-08", subject:5, term:"용손 (溶損)", difficulty:3, def:"큰 전류가 흐르며 생긴 열 때문에 금속이 녹아서 손상되는 것을 말합니다. 마치 촛불에 가까이 댄 플라스틱 빨대가 흐물흐물 녹아버리듯, 뇌격전류의 발열에 견디지 못한 금속 부품은 용손될 수 있어요. 그래서 수뢰부는 재질, 크기, 두께를 잘 골라 녹지 않도록 만듭니다.", source:[81] },
  { id:"s5-09", subject:5, term:"누전차단기", difficulty:1, def:"전기가 정상 통로를 벗어나 새어 나가는(누전) 것을 감지하면 즉시 전원을 끊어 감전 사고를 막는 안전장치입니다. 마치 욕조 물이 넘치려 하면 자동으로 잠기는 수도꼭지처럼, 누전차단기는 위험을 느끼는 순간 회로를 탁 차단해요. 욕실 같은 물기 있는 곳 콘센트에는 꼭 설치합니다.", source:[82] },
  { id:"s5-10", subject:5, term:"정격감도전류", difficulty:3, def:"누전차단기가 이 정도 누설 전류면 위험하다고 판단해 작동을 시작하는 기준 전류값입니다. 마치 화재경보기가 정해진 연기 농도를 넘으면 울리듯, 누설 전류가 정격감도전류에 이르면 차단기가 떨어져요. 욕실처럼 인체가 젖는 장소의 콘센트는 15mA 이하의 예민한 값을 씁니다.", source:[82] },
