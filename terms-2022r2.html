  { id:"s5-11", subject:5, term:"인체감전보호용 누전차단기", difficulty:2, def:"사람이 전기에 감전되는 것을 막는 데 특화된, 매우 예민하고 빠르게 작동하는 누전차단기입니다. 마치 어린이 놀이터에 더 푹신한 바닥을 까는 것처럼, 사람이 다칠 위험이 큰 곳에는 더 민감한 보호 장치를 둬요. 작은 누설 전류에도 순식간에 전원을 끊어 목숨을 지킵니다.", source:[82] },
  { id:"s5-12", subject:5, term:"콘센트", difficulty:1, def:"벽이나 바닥에 붙어 있어 전기 기기의 플러그를 꽂아 전기를 공급받게 해주는 접속 장치입니다. 마치 수도관 끝의 수도꼭지처럼, 콘센트는 건물 안 전선과 우리가 쓰는 가전제품을 이어주는 출구예요. 물기 있는 장소에 시설할 때는 누전차단기로 보호해야 합니다.", source:[82] },
  { id:"s5-13", subject:5, term:"갑종 풍압하중", difficulty:3, def:"전선이나 철탑이 강한 바람을 받을 때 견뎌야 하는 힘을, 가장 센 표준 바람을 기준으로 계산한 값입니다. 마치 우산을 펴고 태풍 속에 서면 손목이 휘청이듯, 바람은 설비를 밀어내는 큰 힘을 줘요. 갑종은 수직 투영면적 1제곱미터당 정해진 압력(강관 철탑은 1255Pa)으로 계산합니다.", source:[83] },
  { id:"s5-14", subject:5, term:"풍압하중", difficulty:2, def:"바람이 전선이나 지지물 같은 시설물을 밀어붙이는 힘으로, 설비가 쓰러지지 않게 설계할 때 반드시 고려하는 하중입니다. 마치 돛에 바람이 차면 배가 앞으로 밀리듯, 전기 설비도 바람을 받으면 옆으로 밀리는 힘을 받아요. 계산은 바람을 받는 면적과 바람 세기를 곱해 구합니다.", source:[83] },
  { id:"s5-15", subject:5, term:"수직 투영면적", difficulty:2, def:"바람이 불어오는 정면에서 물체를 바라봤을 때 보이는 그림자만큼의 면적입니다. 마치 손전등을 비춰 벽에 생긴 그림자 크기를 재는 것과 같아요. 바람은 이 면적에 부딪히므로, 풍압하중을 계산할 때 이 넓이에 단위 면적당 압력을 곱합니다.", source:[83] },
  { id:"s5-16", subject:5, term:"철탑", difficulty:1, def:"높은 전압의 송전선을 공중에 안전하게 매달기 위해 강철 부재를 엮어 세운 큰 탑 모양 지지물입니다. 마치 빨랫줄을 높이 받치는 튼튼한 기둥처럼, 철탑은 전선을 땅에서 멀찍이 띄워 사람과 닿지 않게 해줘요. 바람과 전선 무게를 모두 견디도록 튼튼하게 설계됩니다.", source:[83] },
  { id:"s5-17", subject:5, term:"한국전기설비규정 (KEC)", difficulty:2, def:"우리나라에서 전기 설비를 어떻게 만들고 시설해야 안전한지를 정해 놓은 공식 기술 기준입니다. 마치 도로에서 모두가 지켜야 할 교통 법규처럼, 전기 공사를 하는 사람은 이 규정을 따라야 해요. 용어의 정의부터 시설 방법, 안전 거리까지 폭넓게 담고 있습니다.", source:[84] },
  { id:"s5-18", subject:5, term:"접지도체", difficulty:2, def:"전기 설비의 어떤 부분을 땅(접지극)에 직접 연결해 주는 도체입니다. 마치 정전기가 난 손을 금속에 대면 찌릿하고 빠져나가듯, 접지도체는 새어 나온 전기나 이상 전류를 땅으로 흘려보내는 길이에요. 설비를 접지극과 이어주는 핵심 연결선입니다.", source:[84] },
  { id:"s5-19", subject:5, term:"보호도체 (PE)", difficulty:2, def:"감전 사고를 막기 위해 안전 목적으로 따로 마련해 두는 도체입니다. 마치 자동차의 안전벨트처럼 평소엔 조용히 있다가 사고 순간에 사람을 지켜줘요. 전기 기기에 누전이 생기면 그 위험한 전류를 사람 대신 받아 안전하게 흘려보내, 만지더라도 감전되지 않게 합니다.", source:[84] },
  { id:"s5-20", subject:5, term:"접지극", difficulty:2, def:"땅속에 직접 묻혀 흙과 전기적으로 맞닿아 있는 금속 부분으로, 전기가 대지로 빠져나가는 최종 출구입니다. 마치 빗물이 모여 마지막에 하수구로 빠지듯, 이상 전류는 접지극을 통해 넓은 땅으로 흩어져요. 봉이나 판 모양으로 만들어 흙에 깊이 박습니다.", source:[84] },
  { id:"s5-21", subject:5, term:"유도장해", difficulty:3, def:"전력선에 흐르는 전기가 가까이 있는 통신선에 영향을 끼쳐 통화 잡음이나 오작동을 일으키는 현상입니다. 마치 라디오를 켠 옆에서 헤어드라이어를 돌리면 지직거리는 소리가 섞이듯, 전력선도 옆 통신선을 방해해요. 그래서 두 선을 충분히 떨어뜨리거나 보호 시설을 합니다.", source:[85,97] },
  { id:"s5-22", subject:5, term:"유도작용", difficulty:3, def:"전선이 직접 닿지 않아도 그 둘레에 만들어지는 전기장이나 자기장을 통해 옆 전선에 전압이나 전류를 일으키는 작용입니다. 마치 자석을 가까이 대면 닿지 않아도 쇠붙이가 끌려오듯, 전기도 떨어진 거리에서 영향을 줘요. 교류 전차선로가 통신선에 일으키는 장해의 원인이 됩니다.", source:[85,97] },
  { id:"s5-23", subject:5, term:"전차선로", difficulty:2, def:"전기로 달리는 기차나 전철에 전기를 공급하기 위해 선로 위에 설치한 전선 설비입니다. 마치 범퍼카가 천장에서 전기를 받아 움직이듯, 전동차는 전차선에서 전기를 받아 달려요. 큰 전류가 흐르기 때문에 가까운 통신선에 유도장해를 주지 않게 시설해야 합니다.", source:[85] },
  { id:"s5-24", subject:5, term:"가공 약전류 전선로", difficulty:2, def:"공중에 가설된, 전화나 신호 같은 약한 전류를 쓰는 통신용 전선 설비입니다. 약전류는 전등·전열에 쓰는 센 전류와 달리 신호 전달용의 작은 전류를 뜻해요. 마치 잔잔한 시냇물처럼 흐름이 약해서, 옆 전력선의 유도작용에 쉽게 방해받습니다.", source:[85] },
  { id:"s5-25", subject:5, term:"전기저장장치 (ESS)", difficulty:2, def:"전기를 축전지 등에 모아 두었다가 필요할 때 꺼내 쓰는 설비입니다. 마치 보조 배터리에 전기를 채워 두었다가 휴대폰이 방전됐을 때 충전하듯, ESS는 남는 전기를 저장했다가 부족할 때 공급해요. 집에 설치할 때는 안전을 위한 배선 기준을 지켜야 합니다.", source:[86] },
  { id:"s5-26", subject:5, term:"축전지", difficulty:1, def:"전기를 화학 에너지 형태로 모아 두었다가 다시 전기로 꺼내 쓸 수 있는, 충전이 되는 전지입니다. 마치 물탱크에 물을 채워 두었다가 필요할 때 받아 쓰듯, 축전지는 전기를 담아 두는 그릇이에요. 전기저장장치의 핵심 부품으로 쓰입니다.", source:[86] },
  { id:"s5-27", subject:5, term:"옥내배선", difficulty:1, def:"건물 안에서 전기를 각 방과 콘센트, 조명까지 보내기 위해 벽이나 천장 속에 깔아 놓은 전선 설비입니다. 마치 집안 곳곳으로 물을 보내는 수도 배관처럼, 옥내배선은 전기를 필요한 곳으로 나눠 보내요. 사람이 닿지 않도록 안전하게 시설합니다.", source:[86,99] },
  { id:"s5-28", subject:5, term:"대지전압", difficulty:2, def:"전선이나 충전된 부분과 땅 사이에 걸리는 전압으로, 사람이 그 부분을 만졌을 때 받을 수 있는 전압의 크기입니다. 마치 다이빙대의 높이가 물에 떨어질 때의 충격을 결정하듯, 대지전압이 높을수록 감전 위험이 커져요. 그래서 주택 옥내전로는 대지전압 상한이 정해져 있습니다.", source:[86] },
  { id:"s5-29", subject:5, term:"케이블배선", difficulty:2, def:"절연과 보호 피복을 갖춘 케이블을 그대로 사용해 전기를 보내는 배선 방식입니다. 마치 두꺼운 외투를 입은 사람이 비바람에 잘 견디듯, 케이블은 자체 피복 덕에 외부 충격과 습기에 강해요. 사람이 닿을 우려가 있는 곳에서도 비교적 안전하게 시설할 수 있습니다.", source:[86] },
  { id:"s5-30", subject:5, term:"방호장치", difficulty:1, def:"전선이나 전기 설비가 외부 충격이나 사람의 접촉으로 손상되거나 위험해지지 않도록 덮거나 둘러싸 보호하는 장치입니다. 마치 자전거를 탈 때 무릎 보호대를 차는 것처럼, 방호장치는 약한 부분을 감싸 사고를 예방해요. 전선에 적당한 방호장치를 하면 더 높은 전압까지 시설이 허용되기도 합니다.", source:[86] },
  { id:"s5-31", subject:5, term:"저압", difficulty:2, def:"전압 구분에서 가장 낮은 등급으로, 일반 가정과 사무실에서 흔히 쓰는 안전한 전압 범위입니다. 마치 어린이용 풀장처럼 깊이가 얕아 비교적 다루기 쉬워요. 한국전기설비규정에서는 교류 1000V 이하, 직류 1500V 이하를 저압으로 분류합니다.", source:[87,96,99,100] },
  { id:"s5-32", subject:5, term:"고압", difficulty:2, def:"저압보다 높고 특고압보다는 낮은 중간 등급의 전압입니다. 마치 성인용 수영장처럼 저압보다 깊어 더 조심해서 다뤄야 해요. 한국전기설비규정에서는 교류 1000V·직류 1500V를 초과하고 7000V 이하인 전압을 고압으로 정합니다.", source:[87,88] },
  { id:"s5-33", subject:5, term:"특고압", difficulty:2, def:"전압 구분에서 가장 높은 등급으로, 발전소에서 먼 곳까지 대량으로 송전할 때 쓰는 매우 높은 전압입니다. 마치 깊은 바다처럼 위험해서 전문가만 다뤄야 해요. 한국전기설비규정에서는 7000V를 초과하는 전압을 모두 특고압으로 분류합니다.", source:[87,89,95] },
  { id:"s5-34", subject:5, term:"전압의 구분", difficulty:2, def:"전기의 위험도와 취급 방법을 정하기 위해 전압을 저압·고압·특고압으로 나눈 분류 체계입니다. 마치 도로를 일반도로·자동차전용도로·고속도로로 나눠 규칙을 다르게 두듯, 전압도 등급마다 시설 기준이 달라져요. 교류·직류에 따라 경계 수치가 다릅니다.", source:[87] },
  { id:"s5-35", subject:5, term:"가공전선로", difficulty:1, def:"전봇대나 철탑을 이용해 전선을 공중에 띄워 전기를 보내는 송배전 설비입니다. 마치 빨랫줄을 기둥 사이에 높이 매달아 빨래를 너는 것처럼, 가공전선로는 전선을 땅 위 공중에 가설해요. 땅에 묻는 지중전선로와 대비되는 방식입니다.", source:[88,91,92] },
  { id:"s5-36", subject:5, term:"가공지선", difficulty:3, def:"송전선 가장 위쪽에 따로 한 가닥 더 걸어 두는, 벼락을 막기 위한 보호용 전선입니다. 마치 큰 우산을 펼쳐 그 아래 사람들을 비에서 지키듯, 가공지선이 벼락을 먼저 받아 송전선을 가려줘요. 고압 가공전선로에 나경동선을 쓸 때는 지름 4.0mm 이상이어야 합니다.", source:[88] },
  { id:"s5-37", subject:5, term:"나경동선", difficulty:2, def:"절연 피복을 입히지 않은(나) 구리 재질의 전선입니다. 나는 맨몸을 뜻해 옷을 입지 않은 전선이라는 의미예요. 마치 외투 없이 다니는 사람처럼 피복이 없어, 사람이 닿지 않는 가공지선 같은 용도에 쓰입니다.", source:[88] },
  { id:"s5-38", subject:5, term:"뱅크용량", difficulty:3, def:"변압기 한 묶음(뱅크)이 감당할 수 있는 전력의 크기를 킬로볼트암페어(kVA)로 나타낸 값입니다. 마치 물탱크의 용량이 담을 수 있는 물의 양을 나타내듯, 뱅크용량은 변압기 설비의 처리 능력을 보여줘요. 특고압 변압기는 뱅크용량 5000kVA 이상이면 고장 시 자동 차단·경보 장치를 둬야 합니다.", source:[89] },
  { id:"s5-39", subject:5, term:"특고압용 변압기", difficulty:2, def:"7000V를 넘는 매우 높은 전압을 다루는 변압기로, 송전 전압을 올리거나 내리는 데 쓰입니다. 마치 댐의 거대한 수문이 엄청난 물을 다루듯, 특고압용 변압기는 큰 전압을 취급해요. 내부 고장 위험이 크기 때문에 자동차단장치나 경보장치를 갖춥니다.", source:[89] },
  { id:"s5-40", subject:5, term:"자동차단장치", difficulty:2, def:"설비에 고장이나 이상이 생기면 사람이 손대지 않아도 스스로 전원을 끊어 사고 확대를 막는 장치입니다. 마치 과열되면 저절로 꺼지는 다리미처럼, 위험을 감지하는 순간 알아서 회로를 차단해요. 특고압 변압기 내부 고장 보호 등에 쓰입니다.", source:[89] },
  { id:"s5-41", subject:5, term:"합성수지관", difficulty:2, def:"전선을 안에 넣어 보호하기 위해 사용하는 플라스틱(합성수지) 재질의 관입니다. 마치 빨대 속으로 실을 통과시키듯, 전선을 관 속에 넣어 외부 충격과 습기로부터 지켜요. 가볍고 녹슬지 않으며 절연도 잘 되어 옥내배선에 널리 쓰입니다.", source:[90] },
  { id:"s5-42", subject:5, term:"가요전선관", difficulty:3, def:"구부러지는 성질이 있어 자유롭게 휘어지는 전선 보호용 관입니다. 가요는 부드럽게 휜다는 뜻으로, 마치 휘어지는 빨대처럼 모퉁이나 좁은 곳에서도 쉽게 꺾여 배선할 수 있어요. 진동이 있거나 굴곡이 많은 장소의 전선 보호에 편리합니다.", source:[90,94] },
  { id:"s5-43", subject:5, term:"지지점 간 거리", difficulty:2, def:"관이나 전선을 벽·천장에 고정하는 받침점들 사이의 간격입니다. 마치 빨랫줄이 처지지 않게 받침대를 적당한 간격으로 세우듯, 지지점이 너무 멀면 관이 늘어지거나 떨어질 수 있어요. 합성수지관은 지지점 간 거리를 1.5m 이하로 정합니다.", source:[90] },
  { id:"s5-44", subject:5, term:"바깥지름 (외경)", difficulty:1, def:"관이나 원통의 가장 바깥쪽 가장자리끼리 잰 지름으로, 관의 전체 굵기를 나타냅니다. 마치 김밥을 통째로 보고 잰 굵기와 같아요. 합성수지관을 서로 끼워 접속할 때, 끼우는 깊이를 이 바깥지름의 몇 배로 하라고 기준을 정합니다.", source:[90] },
  { id:"s5-45", subject:5, term:"레일면상의 높이", difficulty:2, def:"전선이나 통신선이 철도 위를 건널 때, 기차 선로(레일)의 윗면을 기준으로 잰 전선까지의 높이입니다. 마치 다리 아래로 배가 지나갈 수 있도록 다리 높이를 정하듯, 기차가 부딪히지 않게 충분한 높이를 확보해요. 22.9kV 가공전선이 철도를 횡단할 때는 6.5m 이상이어야 합니다.", source:[91,92] },
  { id:"s5-46", subject:5, term:"횡단", difficulty:1, def:"전선이나 통신선이 도로, 철도, 강 같은 다른 시설물 위를 가로질러 건너가는 것을 말합니다. 마치 길을 가로질러 건너가는 횡단보도처럼, 전선도 철도 위를 가로지를 수 있어요. 이때는 아래를 지나는 것과 부딪히지 않도록 더 높은 시설 기준을 적용합니다.", source:[91,92] },
  { id:"s5-47", subject:5, term:"전력보안통신설비", difficulty:2, def:"전력 설비를 안전하게 운영하고 감시하기 위해 전선로를 따라 함께 설치하는 통신 설비입니다. 마치 고속도로를 따라 설치된 비상 전화처럼, 사고나 이상을 빠르게 알리는 연락망 역할을 해요. 송전선로 곁에서 운전 정보를 주고받는 데 쓰입니다.", source:[93] },
  { id:"s5-48", subject:5, term:"조가선", difficulty:3, def:"통신선이나 케이블이 자기 무게로 처지지 않도록 위에서 매달아 받쳐 주는 강한 지지용 선입니다. 마치 빨랫줄을 팽팽하게 걸어 두고 거기에 옷을 거는 것처럼, 조가선이 줄 역할을 하고 케이블이 거기에 매달려요. 전력보안통신설비에서는 단면적 38제곱밀리미터 이상의 아연도강연선을 씁니다.", source:[93] },
  { id:"s5-49", subject:5, term:"아연도강연선", difficulty:3, def:"여러 가닥의 강철선을 꼬아 만든 뒤 녹슬지 않도록 표면에 아연을 입힌 튼튼한 줄입니다. 마치 여러 실을 꼬아 굵고 질긴 밧줄을 만들고 거기에 방수 코팅을 입힌 것과 같아요. 강하고 부식에 잘 견뎌서 조가선처럼 무언가를 매다는 용도에 쓰입니다.", source:[93] },
  { id:"s5-50", subject:5, term:"나연동선", difficulty:2, def:"절연 피복을 입히지 않은 부드러운(연) 구리선입니다. 나는 맨몸, 연은 무르고 잘 휜다는 뜻이에요. 마치 잘 구부러지는 철사처럼 다루기 쉬워, 가요전선관에 끼워 접지나 전기적 접속을 하는 데 쓰입니다.", source:[94] },
  { id:"s5-51", subject:5, term:"1종 금속제 가요전선관", difficulty:3, def:"금속으로 만든 휘어지는 전선관 중 첫 번째 종류로, 비교적 얇고 단순한 구조의 관입니다. 마치 얇은 주름빨대처럼 쉽게 휘지만 그만큼 보강이 필요해요. 그래서 관 안에 나연동선을 끼워 양 끝을 전기적으로 이어 접지 효과를 보강합니다.", source:[94] },
  { id:"s5-52", subject:5, term:"특고압 보안공사", difficulty:3, def:"특고압 전선로가 도로·건물·다른 전선 가까이를 지날 때, 사고를 막기 위해 평소보다 더 튼튼하고 안전하게 시공하는 강화된 공사 방법입니다. 마치 사람이 많이 다니는 곳의 다리를 더 굵은 철근으로 짓듯, 위험한 구간은 보강해서 시설해요. 제1종은 그중 가장 엄격한 기준입니다.", source:[95] },
  { id:"s5-53", subject:5, term:"경동연선", difficulty:2, def:"단단한(경) 구리선을 여러 가닥 꼬아 만든 전선입니다. 경은 딱딱하다는 뜻으로, 무른 연동선보다 인장 강도가 세서 잘 끊어지지 않아요. 마치 가는 철사 여러 개를 꼬아 굵고 튼튼한 줄을 만든 것처럼, 강도가 필요한 가공전선로에 쓰입니다.", source:[95] },
  { id:"s5-54", subject:5, term:"단면적", difficulty:1, def:"전선을 똑바로 잘랐을 때 드러나는 자른 면의 넓이로, 보통 제곱밀리미터로 나타냅니다. 마치 굵은 빨대와 가는 빨대의 구멍 크기를 비교하는 것과 같아요. 단면적이 클수록 전선이 굵어 더 큰 전류를 견디고 잘 끊어지지 않아, 시설 기준에서 최소 단면적을 정합니다.", source:[93,94,95] },
  { id:"s5-55", subject:5, term:"옥측전선로", difficulty:3, def:"건물 바깥 벽면을 따라 설치하는 전선로입니다. 옥측은 집의 바깥 측면이라는 뜻으로, 마치 건물 외벽을 타고 올라가는 담쟁이덩굴처럼 전선이 벽 바깥쪽에 붙어 지나가요. 비와 이슬에 노출되므로 시설 방법과 전선 간격 기준이 정해져 있습니다.", source:[96] },
  { id:"s5-56", subject:5, term:"애자공사", difficulty:2, def:"전선을 애자라는 절연 받침에 걸어 벽이나 천장에서 띄워 시설하는 배선 방법입니다. 애자는 사기·유리로 만든 절연체로, 마치 뜨거운 냄비를 식탁에 직접 두지 않고 받침대 위에 올리듯 전선을 구조물에서 떨어뜨려 줘요. 전선끼리, 또 전선과 벽 사이에 일정한 간격을 두고 시설합니다.", source:[96] },
  { id:"s5-57", subject:5, term:"지중전선로", difficulty:2, def:"전선을 땅속에 묻어 전기를 보내는 송배전 설비입니다. 마치 수도관을 땅에 묻어 물을 보내듯, 전선을 지하에 매설해요. 공중에 띄우는 가공전선로와 달리 도시 미관에 좋지만, 가까운 지중 통신선에 유도장해를 주지 않도록 충분히 떨어뜨려 시설합니다.", source:[97] },
  { id:"s5-58", subject:5, term:"누설전류", difficulty:3, def:"전기가 정상 통로를 벗어나 절연이 약해진 틈으로 조금씩 새어 나가는 전류입니다. 마치 낡은 수도관에서 물이 찔끔찔끔 새듯, 절연이 완벽하지 않으면 전류가 엉뚱한 길로 빠져나가요. 이 누설전류는 옆 통신선에 장해를 일으키거나 감전 위험이 됩니다.", source:[97] },
  { id:"s5-59", subject:5, term:"절연내력", difficulty:3, def:"절연체가 전기를 얼마나 높은 전압까지 새지 않게 막아낼 수 있는지를 나타내는 견디는 능력입니다. 마치 댐이 얼마나 높은 수압까지 무너지지 않고 버티는지와 같아요. 정해진 시험 전압을 일정 시간 걸어도 절연이 깨지지 않아야 합격이며, 회전기는 최대사용전압의 정해진 배수로 시험합니다.", source:[98] },
  { id:"s5-60", subject:5, term:"절연내력시험", difficulty:3, def:"전기 기기에 일부러 평소보다 높은 시험 전압을 일정 시간 걸어, 절연이 견디는지 확인하는 안전 검사입니다. 마치 새로 산 우산을 일부러 센 물줄기에 대 보며 새는지 확인하는 것과 같아요. 시험 전압은 최대사용전압을 기준으로 정한 배수로 정해집니다.", source:[98] },

  { id:"s5-62", subject:5, term:"회전기", difficulty:2, def:"전동기나 발전기처럼 내부가 빙글빙글 도는 구조로 작동하는 전기 기계를 통틀어 부르는 말입니다. 마치 팽이나 선풍기 날개처럼 회전 운동을 핵심으로 해요. 절연내력시험을 할 때 회전기는 변압기 같은 정지기와 시험 전압 기준이 다릅니다.", source:[98] },
  { id:"s5-63", subject:5, term:"폭연성 분진", difficulty:3, def:"공기 중에 떠다니다가 불꽃을 만나면 순식간에 폭발할 수 있는 미세한 가루입니다. 마치 밀가루를 공중에 흩뿌리고 불을 붙이면 확 타오르듯, 금속 가루 같은 폭연성 분진은 매우 위험해요. 이런 곳의 저압 옥내배선은 불꽃이 새지 않는 금속관공사로 시설해야 합니다.", source:[99] },
  { id:"s5-64", subject:5, term:"발화원", difficulty:2, def:"불이 처음 붙게 만드는 원인, 즉 불씨가 되는 것을 말합니다. 마치 마른 장작 더미에 떨어진 작은 불티 하나가 큰불을 일으키듯, 전기 스파크나 과열도 발화원이 될 수 있어요. 분진이나 화약이 있는 곳에서는 전기설비가 발화원이 되지 않게 특별히 시공합니다.", source:[99] },
  { id:"s5-65", subject:5, term:"금속관공사", difficulty:2, def:"전선을 튼튼한 금속 관 속에 넣어 보호하며 배선하는 공사 방법입니다. 마치 갑옷을 입은 기사처럼 금속관이 전선을 충격과 불꽃으로부터 단단히 감싸 줘요. 외부로 불꽃이 새지 않아, 폭발 위험이 있는 분진·화약 장소의 배선에 적합합니다.", source:[99] },

/* ============ CONSTANTS / STATE ============ */
const LS = { progress:"terms2022r2:progress", qlog:"terms2022r2:qlog", theme:"terms2022r2:theme" };
const QUIZ_LEN = 10, PASS = 0.7;
const AI_SUGGESTS = ["이 용어를 더 쉽게 풀어서 설명해줘","실제 현장에서 어디에 쓰여?","비슷한데 헷갈리는 용어와 차이는?"];

let progress = load(LS.progress, { learned:{}, stages:{} });
let qlog = load(LS.qlog, []);
let state = { screen:"map", stageId:null, tab:"story", quiz:null, review:null, ai:null, search:"" };

/* ============ UTIL ============ */
function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stars(d){ return "★".repeat(d); }

/* ============ DOMAIN HELPERS ============ */
function stageById(id){ return STORY.stages.find(s=>s.subject===id); }
function termsOf(subject){ return TERMS.filter(t=>t.subject===subject); }
function learnedIn(subject){ return termsOf(subject).filter(t=>progress.learned[t.id]).length; }
function totalLearned(){ return TERMS.filter(t=>progress.learned[t.id]).length; }
function clearedCount(){ return STORY.stages.filter(s=>progress.stages[s.subject]&&progress.stages[s.subject].cleared).length; }
function rankName(){ return STORY.grades[Math.min(clearedCount(),STORY.grades.length-1)]; }
function isUnlocked(subject){
  if(subject===1) return true;
  const prev=progress.stages[subject-1];
  return !!(prev&&prev.cleared);
}
function stageStars(subject){
  const st=progress.stages[subject];
  if(!st||!st.cleared) return 0;
  if(st.best>=1) return 3;
  if(st.best>=0.85) return 2;
  return 1;
}

/* ============ RENDER DISPATCH ============ */
const app = document.getElementById("app");
function render(){
  if(state.screen==="map") renderMap();
  else if(state.screen==="gate") renderGate();
  else if(state.screen==="qnote") renderQnote();
  else if(state.screen==="review") renderReview();
  window.scrollTo(0,0);
}

/* ============ MAP ============ */
function renderMap(){
  const total=TERMS.length, learned=totalLearned(), cleared=clearedCount();
  const pct=total?Math.round(learned/total*100):0;
  let stagesHtml="";
  STORY.stages.forEach(s=>{
    const unlocked=isUnlocked(s.subject);
    const tot=termsOf(s.subject).length;
    const ln=learnedIn(s.subject);
    const st=progress.stages[s.subject]||{};
    const sp=stageStars(s.subject);
    let status="";
    if(!unlocked) status="🔒";
    else if(st.cleared) status="⭐".repeat(sp);
    const mini=tot?Math.round(ln/tot*100):0;
    stagesHtml+=`<div class="stage ${unlocked?"":"locked"} ${st.cleared?"cleared":""}" ${unlocked?`data-act="stage" data-id="${s.subject}"`:""}>
      <div class="stage-ic">${s.icon}</div>
      <div class="stage-body">
        <div class="stage-no">관문 ${s.subject}</div>
        <div class="stage-name">${esc(s.name)}</div>
        <div class="stage-sub">${esc(s.subjectName)} · 용어 ${tot}개</div>
        <div class="stage-prog">
          <div class="mini"><span style="width:${mini}%"></span></div>
          <div class="lab">${ln}/${tot} 학습${st.cleared?" · 통과":""}</div>
        </div>
      </div>
      <div class="stage-status">${status}</div>
    </div>`;
  });
  const masterBanner = cleared>=5
    ? `<div class="hero" style="background:linear-gradient(135deg,var(--accent),#ff8a3d);color:#3a2600">
        <div class="rank">🏆 축하합니다<b>전기 명장 달성!</b></div>
        <div style="font-size:13px;margin-top:6px">다섯 관문의 모든 용어가 당신의 것이 되었습니다.</div></div>`
    : "";
  app.innerHTML=`
  <div class="topbar">
    <div><h1>⚡ ${esc(STORY.title)}</h1><div class="sub">${esc(STORY.round)} · 용어 ${total}개</div></div>
    <button class="icon-btn" data-act="theme" title="화면 모드">${document.documentElement.dataset.theme==="dark"?"☀️":"🌙"}</button>
  </div>
  ${masterBanner}
  <div class="hero">
    <div class="rank">현재 등급<b>${esc(rankName())}</b></div>
    <div class="pwrap">
      <div class="pbar"><span style="width:${pct}%"></span></div>
      <div class="pstat"><span>관문 ${cleared}/5 통과</span><span>용어 ${learned}/${total} 학습</span></div>
    </div>
  </div>
  <div class="intro-note">${esc(STORY.intro)}</div>
  ${stagesHtml}
  <div class="btn-row">
    <button class="btn" data-act="qnote">📒 질문 노트 (${qlog.length})</button>
    <button class="btn" data-act="review-start">🔁 복기</button>
  </div>
  <div class="foot">
    <button data-act="reset">학습 기록 초기화</button>
    <div class="v">terms v1.0 · 전기기사 CBT</div>
  </div>`;
}

/* ============ GATE ============ */
function renderGate(){
  const s=stageById(state.stageId);
  const tot=termsOf(s.subject).length, ln=learnedIn(s.subject);
  const tabs=[["story","📖 스토리"],["terms","🗂️ 용어"],["quiz","✏️ 퀴즈"]];
  let body="";
  if(state.tab==="story") body=gateStory(s);
  else if(state.tab==="terms") body=gateTerms(s,tot,ln);
  else body=gateQuiz(s);
  app.innerHTML=`
  <div class="topbar">
    <button class="back-btn" data-act="map">‹ 관문 맵</button>
    <div class="sub">${esc(s.name)} · ${ln}/${tot} 학습</div>
  </div>
  <div class="tabs">
    ${tabs.map(([k,l])=>`<button class="tab ${state.tab===k?"active":""}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}
  </div>
  ${body}`;
}
function gateStory(s){
  const st=progress.stages[s.subject]||{};
  return `<div class="story-box">
    <div class="story-stage">관문 ${s.subject} · ${esc(s.subjectName)}</div>
    <div class="story-title">${s.icon} ${esc(s.name)}</div>
    <div class="mentor">
      <div class="face">${s.face}</div>
      <div><div class="who">${esc(s.mentor)}</div><div class="line">“${esc(s.line)}”</div></div>
    </div>
    <div class="story-text">${esc(s.intro)}</div>
    ${st.cleared?`<div class="story-text" style="margin-top:12px;color:var(--good);font-weight:700">✅ ${esc(s.clear)}</div>`:""}
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-act="tab" data-tab="terms">용어 배우러 가기 →</button>
  </div>`;
}
function gateTerms(s,tot,ln){
  const list=termsOf(s.subject);
  if(!list.length) return `<div class="empty"><div class="big">📭</div>이 관문의 용어를 준비 중입니다.</div>`;
  const cards=list.map(t=>{
    const learned=!!progress.learned[t.id];
    const dcls="d"+t.difficulty;
    return `<div class="tcard ${learned?"learned":""}" data-id="${t.id}">
      <div class="tcard-head" data-act="flip" data-id="${t.id}">
        <div class="tcard-term">${esc(t.term)}</div>
        <div class="tcard-stars ${dcls}">${stars(t.difficulty)}</div>
        <div class="tcard-learn-dot">${learned?"✅":""}</div>
      </div>
      <div class="tcard-tip" data-act="flip" data-id="${t.id}">탭하여 뜻 보기</div>
      <div class="tcard-def">
        <div class="tcard-def-in">
          <p>${esc(t.def)}</p>
          <div class="tcard-src">📄 출처 문제 ${t.source.join(", ")}</div>
          <div class="tcard-acts">
            <button class="btn ${learned?"":"btn-accent"}" data-act="learn" data-id="${t.id}">${learned?"✓ 익힘 해제":"익힘 체크"}</button>
            <button class="btn btn-primary" data-act="ai" data-id="${t.id}">🤖 AI에게 묻기</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  return `<div class="grid-info"><span>용어 ${tot}개</span><span>${ln}개 학습 완료</span></div>
    <div class="cardgrid">${cards}</div>`;
}
function gateQuiz(s){
  if(state.quiz) return renderQuizBody(s);
  const pool=termsOf(s.subject);
  const n=Math.min(QUIZ_LEN,pool.length);
  const st=progress.stages[s.subject]||{};
  return `<div class="quiz-intro">
    <h3>✏️ ${esc(s.name)} 퀴즈</h3>
    <p>${n}문항 · ${Math.round(PASS*100)}% 이상 맞히면 관문 통과</p>
    <p>용어 설명을 읽고 알맞은 용어를 고르세요.</p>
    ${st.cleared?`<div class="qbest">최고 점수 ${Math.round(st.best*100)}% · ${"⭐".repeat(stageStars(s.subject))}</div>`:""}
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-act="quiz-start">${st.cleared?"다시 도전":"퀴즈 시작"}</button>
  </div>`;
}

/* ============ QUIZ LOGIC ============ */
function buildQuiz(subject){
  const pool=termsOf(subject);
  const picked=shuffle(pool).slice(0,Math.min(QUIZ_LEN,pool.length));
  return picked.map(t=>{
    const others=shuffle(pool.filter(x=>x.id!==t.id&&x.term!==t.term)).slice(0,3).map(x=>x.term);
    return { termId:t.id, prompt:t.def, answer:t.term, term:t, choices:shuffle([t.term,...others]) };
  });
}
function renderQuizBody(s){
  const q=state.quiz;
  const item=q.items[q.i];
  const done=q.i>=q.items.length;
  if(done) return renderQuizResult(s);
  const pct=Math.round(q.i/q.items.length*100);
  const choices=item.choices.map((c,idx)=>{
    let cls="choice";
    let mk="○";
    if(q.answered){
      cls+=" disabled";
      if(c===item.answer){ cls+=" correct"; mk="✓"; }
      else if(idx===q.picked){ cls+=" wrong"; mk="✕"; }
    }
    return `<button class="${cls}" data-act="quiz-pick" data-idx="${idx}"><span class="mk">${mk}</span><span>${esc(c)}</span></button>`;
  }).join("");
  let explain="";
  if(q.answered){
    const ok=item.choices[q.picked]===item.answer;
    explain=`<div class="q-explain">${ok?"✅ 정답!":"❌ 아쉬워요."} 정답은 <b>${esc(item.answer)}</b> 입니다.</div>
      <button class="btn btn-primary btn-block" style="margin-top:12px" data-act="quiz-next">${q.i+1>=q.items.length?"결과 보기":"다음 문제 →"}</button>`;
  }
  return `<div class="qhead"><span>문제 ${q.i+1} / ${q.items.length}</span><span>맞힘 ${q.correct}</span></div>
    <div class="qbar"><span style="width:${pct}%"></span></div>
    <div class="q-prompt"><span class="q-ask">이 설명에 알맞은 용어는?</span>${esc(item.prompt)}</div>
    <div class="q-choices">${choices}</div>
    ${explain}`;
}
function renderQuizResult(s){
  const q=state.quiz;
  const ratio=q.correct/q.items.length;
  const passed=ratio>=PASS;
  const prevCleared=progress.stages[s.subject]&&progress.stages[s.subject].cleared;
  let rankup="";
  if(passed){
    const before=clearedCount();
    const st=progress.stages[s.subject]||{best:0,cleared:false};
    st.best=Math.max(st.best||0,ratio);
    st.cleared=true;
    progress.stages[s.subject]=st;
    save(LS.progress,progress);
    const after=clearedCount();
    if(after>before){
      rankup=`<div class="rankup">🎖️ 승급! 이제 당신은 <b>${esc(rankName())}</b> 입니다.<br>${esc(s.clear)}</div>`;
      if(after>=5) rankup+=`<div class="rankup" style="margin-top:8px">🏆 모든 관문 통과 — 전기 명장!</div>`;
      else rankup+=`<div class="rankup" style="margin-top:8px">다음 관문 «${esc(stageById(s.subject+1).name)}»이 열렸습니다.</div>`;
    }
  }
  return `<div class="result">
    <div class="big">${passed?"🎉":"💪"}</div>
    <div class="verdict">${passed?"관문 통과!":"한 번 더!"}</div>
    <div class="score">${q.items.length}문제 중 ${q.correct}문제 정답 · ${Math.round(ratio*100)}%</div>
    ${passed?`<div class="score" style="margin-top:4px">통과 기준 ${Math.round(PASS*100)}%</div>`:`<div class="score" style="margin-top:4px">${Math.round(PASS*100)}% 이상이면 통과해요</div>`}
    ${rankup}
    <div class="btn-row">
      <button class="btn" data-act="quiz-retry">다시 풀기</button>
      <button class="btn btn-primary" data-act="map">관문 맵</button>
    </div>
  </div>`;
}

/* ============ QNOTE ============ */
function renderQnote(){
  const kw=state.search.trim().toLowerCase();
  let entries=qlog.slice().reverse();
  if(kw) entries=entries.filter(e=>(e.question+" "+e.answer+" "+e.term).toLowerCase().includes(kw));
  let body;
  if(!qlog.length){
    body=`<div class="empty"><div class="big">📒</div>아직 AI에게 물어본 기록이 없습니다.<br>용어 카드에서 «🤖 AI에게 묻기»로 질문해 보세요.</div>`;
  } else if(!entries.length){
    body=`<div class="empty"><div class="big">🔍</div>«${esc(state.search)}» 검색 결과가 없습니다.</div>`;
  } else {
    const groups={};
    entries.forEach(e=>{ (groups[e.subject]=groups[e.subject]||[]).push(e); });
    body=STORY.stages.filter(s=>groups[s.subject]).map(s=>{
      const items=groups[s.subject].map(e=>`
        <div class="qn-item" data-id="${e.id}">
          <div class="qn-top">
            <div class="qn-main" data-act="qn-toggle" data-id="${e.id}">
              <div class="qn-term">${esc(e.term)}</div>
              <div class="qn-q">${esc(e.question)}</div>
              <div class="qn-meta">${new Date(e.ts).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
            </div>
            <button class="qn-del" data-act="qn-del" data-id="${e.id}" title="삭제">🗑️</button>
          </div>
          <div class="qn-a"><div class="qn-a-in">${fmtAi(e.answer)}</div></div>
        </div>`).join("");
      return `<div class="qn-group-title">${s.icon} ${esc(s.name)} (${groups[s.subject].length})</div>${items}`;
    }).join("");
  }
  app.innerHTML=`
  <div class="topbar">
    <button class="back-btn" data-act="map">‹ 관문 맵</button>
    <div class="sub">질문 노트 · ${qlog.length}개</div>
  </div>
  ${qlog.length?`<input class="search" data-act="search" placeholder="🔍 질문·답변 검색" value="${esc(state.search)}">`:""}
  ${qlog.length?`<button class="btn btn-primary btn-block" data-act="review-start" style="margin-bottom:13px">🔁 복기 모드로 다시 보기</button>`:""}
  ${body}`;
  const si=app.querySelector(".search");
  if(si) si.addEventListener("input",e=>{ state.search=e.target.value; });
}

/* ============ REVIEW (복기) ============ */
function renderReview(){
  const rv=state.review;
  if(!rv||!rv.items.length){
    app.innerHTML=`
    <div class="topbar"><button class="back-btn" data-act="map">‹ 관문 맵</button><div class="sub">복기</div></div>
    <div class="empty"><div class="big">🔁</div>복기할 질문 기록이 없습니다.<br>용어 카드의 «🤖 AI에게 묻기»로 먼저 질문해 보세요.</div>`;
    return;
  }
  const e=rv.items[rv.i];
  app.innerHTML=`
  <div class="topbar">
    <button class="back-btn" data-act="map">‹ 관문 맵</button>
    <div class="sub">복기 ${rv.i+1}/${rv.items.length}</div>
  </div>
  <div class="rv-count">내가 AI에게 했던 질문을 다시 떠올려 보세요</div>
  <div class="rv-card">
    <div class="rv-tag">${esc(e.term)}</div>
    <div class="rv-q">${esc(e.question)}</div>
    ${rv.revealed
      ? `<div class="rv-ans">${fmtAi(e.answer)}</div>`
      : `<div class="rv-hint">탭하면 그때의 답변이 나옵니다</div>`}
  </div>
  ${!rv.revealed?`<button class="btn btn-primary btn-block section-gap" data-act="rv-reveal">답변 확인</button>`:""}
  <div class="rv-nav">
    <button class="btn" data-act="rv-prev" ${rv.i===0?"disabled":""}>‹ 이전</button>
    <button class="btn ${rv.i+1>=rv.items.length?"":"btn-primary"}" data-act="rv-next">${rv.i+1>=rv.items.length?"처음으로":"다음 ›"}</button>
  </div>`;
}

/* ============ AI MODAL ============ */
const aiEl=document.getElementById("ai");
function fmtAi(s){
  return esc(s).replace(/\$\$?([^$]+)\$\$?/g,"$1").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}
function openAi(termId){
  const t=TERMS.find(x=>x.id===termId);
  if(!t) return;
  state.ai={ termId, messages:[], loading:false, error:null };
  renderAi();
}
function closeAi(){ state.ai=null; aiEl.classList.add("hidden"); aiEl.setAttribute("aria-hidden","true"); aiEl.innerHTML=""; }
function renderAi(){
  const ai=state.ai;
  if(!ai){ closeAi(); return; }
  const t=TERMS.find(x=>x.id===ai.termId);
  let msgs="";
  if(!ai.messages.length){
    msgs=`<div class="ai-suggests">${AI_SUGGESTS.map(q=>`<button class="suggest" data-act="ai-suggest" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  } else {
    msgs=ai.messages.map(m=>`<div class="msg ${m.role}"><div class="bubble">${m.role==="model"?fmtAi(m.content):esc(m.content)}</div></div>`).join("");
  }
  if(ai.loading) msgs+=`<div class="ai-loading">🤖 답변을 생각하고 있어요…</div>`;
  if(ai.error) msgs+=`<div class="ai-err">⚠️ ${esc(ai.error)}</div>`;
  aiEl.innerHTML=`
  <div class="ai-ov" data-act="ai-close"></div>
  <div class="ai-sheet">
    <div class="ai-head">
      <div class="t"><b>🤖 ${esc(t.term)}</b><span>이 용어에 대해 무엇이든 물어보세요</span></div>
      <button class="icon-btn" data-act="ai-close">✕</button>
    </div>
    <div class="ai-body">
      <div class="ai-def">📘 ${esc(t.def)}</div>
      ${msgs}
    </div>
    <div class="ai-foot">
      <textarea class="ai-input" rows="1" placeholder="질문을 입력하세요" ${ai.loading?"disabled":""}></textarea>
      <button class="ai-send" data-act="ai-send" ${ai.loading?"disabled":""}>↑</button>
    </div>
  </div>`;
  aiEl.classList.remove("hidden");
  aiEl.setAttribute("aria-hidden","false");
  const body=aiEl.querySelector(".ai-body");
  if(body) body.scrollTop=body.scrollHeight;
  const ta=aiEl.querySelector(".ai-input");
  if(ta){
    ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,110)+"px"; });
    ta.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||e.shiftKey||e.isComposing) return;
      if(window.matchMedia("(pointer: coarse)").matches) return;
      e.preventDefault();
      submitAi();
    });
    if(!ai.loading) ta.focus();
  }
}
function submitAi(){
  const ta=aiEl.querySelector(".ai-input");
  if(!ta) return;
  const v=ta.value.trim();
  if(v) sendAi(v);
}
async function sendAi(question){
  const ai=state.ai;
  if(!ai||ai.loading) return;
  question=String(question||"").trim();
  if(!question) return;
  const t=TERMS.find(x=>x.id===ai.termId);
  const s=stageById(t.subject);
  ai.messages.push({ role:"user", content:question });
  ai.loading=true; ai.error=null;
  renderAi();
  try{
    const history=ai.messages.slice(0,-1);
    const card={
      no:(t.source&&t.source[0])||0,
      subject:s?s.subjectName:"전기기사",
      q:"[전기기사 용어 학습] 아래 용어에 대한 학생의 질문에 답해줘.\n용어: "+t.term+"\n분야: "+(s?s.subjectName:"")+"\n교재 정의: "+t.def,
      c:[], a:0
    };
    const res=await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ card, question, history })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||("요청 실패 ("+res.status+")"));
    const answer=data.answer||"(빈 응답)";
    ai.messages.push({ role:"model", content:answer });
    qlog.push({ id:uid(), ts:Date.now(), termId:t.id, term:t.term, subject:t.subject, question, answer });
    save(LS.qlog,qlog);
  }catch(e){
    ai.error=(e&&e.message)||"AI 호출에 실패했습니다";
  }finally{
    ai.loading=false;
    renderAi();
  }
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case "theme":{
      const dark=document.documentElement.dataset.theme==="dark";
      document.documentElement.dataset.theme=dark?"light":"dark";
      save(LS.theme,dark?"light":"dark");
      renderMap();
      break;
    }
    case "stage": state.stageId=+id; state.tab="story"; state.quiz=null; state.screen="gate"; render(); break;
    case "map": state.screen="map"; state.quiz=null; render(); break;
    case "tab": state.tab=el.dataset.tab; if(state.tab!=="quiz") state.quiz=null; renderGate(); break;
    case "flip":{
      const card=app.querySelector('.tcard[data-id="'+id+'"]');
      if(card) card.classList.toggle("open");
      break;
    }
    case "learn":{
      if(progress.learned[id]) delete progress.learned[id];
      else progress.learned[id]=1;
      save(LS.progress,progress);
      renderGate();
      const c=app.querySelector('.tcard[data-id="'+id+'"]');
      if(c) c.classList.add("open");
      break;
    }
    case "ai": openAi(id); break;
    case "ai-close": closeAi(); break;
    case "ai-send": submitAi(); break;
    case "ai-suggest": sendAi(el.dataset.q); break;
    case "quiz-start": case "quiz-retry":
      state.quiz={ items:buildQuiz(state.stageId), i:0, picked:null, answered:false, correct:0 };
      state.tab="quiz"; renderGate(); break;
    case "quiz-pick":{
      const q=state.quiz; if(!q||q.answered) break;
      q.picked=+el.dataset.idx; q.answered=true;
      if(q.items[q.i].choices[q.picked]===q.items[q.i].answer) q.correct++;
      renderGate(); break;
    }
    case "quiz-next":{
      const q=state.quiz; q.i++; q.picked=null; q.answered=false; renderGate(); break;
    }
    case "qnote": state.screen="qnote"; state.search=""; render(); break;
    case "qn-toggle":{
      const it=app.querySelector('.qn-item[data-id="'+id+'"]');
      if(it) it.classList.toggle("open");
      break;
    }
    case "qn-del":
      qlog=qlog.filter(x=>x.id!==id); save(LS.qlog,qlog); renderQnote(); break;
    case "review-start":
      state.review={ items:qlog.slice().reverse(), i:0, revealed:false };
      state.screen="review"; render(); break;
    case "rv-reveal": state.review.revealed=true; renderReview(); break;
    case "rv-prev":
      if(state.review.i>0){ state.review.i--; state.review.revealed=false; renderReview(); } break;
    case "rv-next":
      if(state.review.i+1>=state.review.items.length){ state.review.i=0; }
      else state.review.i++;
      state.review.revealed=false; renderReview(); break;
    case "reset":
      if(confirm("학습 기록(익힌 용어·관문 통과·등급)을 모두 지울까요? 질문 노트는 유지됩니다.")){
        progress={ learned:{}, stages:{} };
        save(LS.progress,progress);
        renderMap();
      }
      break;
  }
});

/* ============ BOOT ============ */
(function init(){
  const th=load(LS.theme,null);
  if(th==="dark"||(!th&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches))
    document.documentElement.dataset.theme="dark";
  render();
})();
</script>
